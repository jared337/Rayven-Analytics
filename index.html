      level: 3,
      wide: true,
      desc: "Pick device, metric, range, aggregation and chart style. Zoom in, read live stats, then export to CSV.",
      render(b) {
        const metrics = { temp: ["Temperature", "°C", 4], humidity: ["Humidity", "%", 10], power: ["Power", "kW", 8] };
        const ranges = { 1: "24 hours", 7: "7 days", 30: "30 days" };
        const aggs = { raw: ["Raw", 0], h: ["Hourly", HOUR], d: ["Daily", DAY] };
        const fns = { avg: ["Average", avg], max: ["Maximum", a => Math.max(...a)], min: ["Minimum", a => Math.min(...a)], sum: ["Sum", a => a.reduce((s, v) => s + v, 0)] };
        const opts = (o, v) => Object.entries(o).map(([k, l]) => `<option value="${k}" ${k == v ? "selected" : ""}>${Array.isArray(l) ? l[0] : l}</option>`).join("");
        const ctl = AX.add(b, `<div class="ax-ctl">
          <select class="ax-select" data-k="dev" aria-label="Device">${D.devices.slice(0, 20).map(d => `<option value="${d.id}">${d.id} · ${d.name}</option>`).join("")}</select>
          <select class="ax-select" data-k="metric" aria-label="Metric">${opts(metrics, "temp")}</select>
          <select class="ax-select" data-k="range" aria-label="Range">${opts(ranges, 7)}</select>
          <select class="ax-select" data-k="agg" aria-label="Aggregation">${opts(aggs, "h")}</select>
          <select class="ax-select" data-k="fn" aria-label="Function">${opts(fns, "avg")}</select>
          ${AX.seg([["line", "Line"], ["area", "Area"], ["bar", "Bar"]], "line")}
          <button class="ax-btn" data-csv style="margin-left:auto">Export CSV</button>
        </div>`);
        const stats = AX.add(b, `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px"></div>`);
        const c = AX.chart(b, { xAxis: timeAxis(), yAxis: { type: "value", scale: true }, dataZoom: [{ type: "inside" }, { type: "slider", height: 20, bottom: 6 }], series: [] }, 280);
        let style = "line", rows = [];
        const v = k => ctl.querySelector(`[data-k="${k}"]`).value;
        const showStats = (from = 0, to = 100) => {
          const a = Math.floor((rows.length - 1) * from / 100), z = Math.ceil((rows.length - 1) * to / 100);
          const vals = rows.slice(a, z + 1).map(r => r[1]);
          const [, unit] = metrics[v("metric")];
          stats.innerHTML = [["Points", vals.length, ""], ["Min", Math.min(...vals).toFixed(1), unit], ["Max", Math.max(...vals).toFixed(1), unit], ["Average", avg(vals).toFixed(1), unit], ["Latest", vals[vals.length - 1]?.toFixed(1), unit]]
            .map(([l, x, u]) => `<div style="background:var(--rv-bg);border-radius:7px;padding:6px 10px"><div class="ax-small ax-muted">${l}</div><strong>${x} ${u}</strong></div>`).join("");
        };
        const draw = () => {
          const dev = D.devices.find(d => d.id === v("dev")), [name, unit, amp] = metrics[v("metric")];
          ctl.querySelector('[data-k="fn"]').disabled = v("agg") === "raw";
          const days = +v("range"), n = days * 96;
          const raw = sensor(n, 15 * MIN, { base: dev[v("metric")], amp, noise: amp / 3, seed: +dev.id.slice(4) + v("metric").length });
          rows = v("agg") === "raw" ? raw : bucket(raw, aggs[v("agg")][1], fns[v("fn")][1]);
          c.setOption({
            yAxis: { name: unit },
            dataZoom: [{ start: 0, end: 100 }, { start: 0, end: 100 }],
            series: [{ type: style === "bar" ? "bar" : "line", name: `${dev.id} ${name}`, data: rows, areaStyle: style === "area" ? { opacity: 0.2 } : undefined, sampling: "lttb", showSymbol: false }]
          }, { replaceMerge: ["series"] });
          showStats();
        };
        c.on("dataZoom", () => { const z = c.getOption().dataZoom[0]; showStats(z.start, z.end); });
        ctl.addEventListener("change", draw);
        AX.onSeg(ctl.querySelector(".ax-seg"), s => { style = s; draw(); });
        ctl.querySelector("[data-csv]").addEventListener("click", () => {
          AX.download(`${v("dev")}-${v("metric")}.csv`, AX.csv(rows.map(([t, x]) => ({ time: new Date(t).toISOString(), value: x })), [{ key: "time" }, { key: "value" }]));
          AX.toast(`Exported ${rows.length} rows`, "good");
        });
        draw();
      }
    }
  ]);
})();
</script>
<script>
/* ==========================================================================
 * Maps: 20 examples, simple to advanced (Leaflet)
 * ========================================================================== */
(() => {
  const SYD = [-33.87, 151.21];
  const km = m => (m / 1000).toFixed(1) + " km";
  const legend = items => `<div class="ax-ctl ax-small">${items.map(([c, l]) => `<span class="ax-row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:${c}"></span>${l}</span>`).join("")}</div>`;

  /* Points scattered around Sydney for density examples */
  function cloud(n, seed, spread = 0.35) {
    const r = D.rng(seed), hubs = [[-33.87, 151.21], [-33.82, 151.0], [-33.95, 151.15], [-33.75, 151.25]];
    return Array.from({ length: n }, () => {
      const h = hubs[Math.floor(r() * hubs.length)], g = () => (r() + r() + r() - 1.5) * spread * 0.4;
      return [h[0] + g(), h[1] + g(), r()];
    });
  }

  /* Wobbly route between two points */
  function route(a, b, n, seed) {
    const r = D.rng(seed);
    return Array.from({ length: n }, (_, i) => {
      const t = i / (n - 1), wob = Math.sin(t * Math.PI) * 0.08;
      return [a[0] + (b[0] - a[0]) * t + (r() - 0.5) * 0.02 + wob, a[1] + (b[1] - a[1]) * t + (r() - 0.5) * 0.02];
    });
  }

  AX.section("maps", [
    {
      title: "Single Marker",
      level: 1,
      desc: "One location pinned on a map. The simplest way to show where an asset is.",
      render(b) {
        const m = AX.map(b, { center: SYD, zoom: 12, height: 260 });
        L.marker(SYD).addTo(m).bindPopup("<strong>Sydney Plant</strong><br>42 devices").openPopup();
      }
    },
    {
      title: "Markers with Popups",
      level: 1,
      desc: "All sites as markers. Click any marker for its details.",
      render(b) {
        const m = AX.map(b, { height: 260 });
        D.sites.forEach(s => {
          const devs = D.devices.filter(d => d.site === s.name);
          L.marker([s.lat, s.lng]).addTo(m).bindPopup(`<strong>${s.name}</strong><br>${s.region} · ${devs.length} devices<br>${devs.filter(d => d.status !== "Online").length} need attention`);
        });
      }
    },
    {
      title: "Status-Coloured Markers",
      level: 1,
      desc: "Each device coloured by status, so problem areas are visible without clicking anything.",
      render(b) {
        b.innerHTML = legend(Object.entries(AX.STATUS_COLOR).map(([s, c]) => [c, s]));
        const m = AX.map(b, { center: SYD, zoom: 10, height: 240 });
        D.devices.filter(d => d.siteId === "SYD" || d.siteId === "NEW").forEach(d =>
          L.marker([d.lat, d.lng], { icon: AX.dot(AX.STATUS_COLOR[d.status]) }).addTo(m).bindTooltip(`${d.id} · ${d.status}`));
        m.fitBounds(D.devices.filter(d => d.siteId === "SYD").map(d => [d.lat, d.lng]), { padding: [20, 20] });
      }
    },
    {
      title: "Proportional Circles",
      level: 2,
      desc: "Circle size shows a value (total power per site), colour shows its share of alerts.",
      render(b) {
        const m = AX.map(b, { height: 280 });
        D.sites.forEach(s => {
          const devs = D.devices.filter(d => d.site === s.name);
          const kw = devs.reduce((a, d) => a + d.power, 0), alerts = devs.reduce((a, d) => a + d.alerts, 0);
          L.circleMarker([s.lat, s.lng], { radius: 5 + Math.sqrt(kw) * 1.1, color: alerts > 12 ? "#ef4444" : "#4f46e5", fillOpacity: 0.25, weight: 1.5 })
            .addTo(m).bindTooltip(`<strong>${s.name}</strong><br>${F.num(kw, 1)} kW · ${alerts} alerts`);
        });
      }
    },
    {
      title: "Basemap Switcher",
      level: 2,
      desc: "Switch between light, street, dark, terrain and satellite basemaps, and toggle overlay layers on and off.",
      render(b) {
        const m = AX.map(b, { base: null, center: [-34.5, 147], zoom: 5, height: 280 });
        const bases = { Light: AX.tiles("light"), Street: AX.tiles("street"), Dark: AX.tiles("dark"), Terrain: AX.tiles("topo"), Satellite: AX.tiles("satellite") };
        bases.Light.addTo(m);
        const sites = L.layerGroup(D.sites.map(s => L.marker([s.lat, s.lng]).bindTooltip(s.name))).addTo(m);
        const offline = L.layerGroup(D.devices.filter(d => d.status === "Offline").map(d => L.circleMarker([d.lat, d.lng], { radius: 7, color: "#ef4444" }).bindTooltip(d.id)));
        L.control.layers(bases, { Sites: sites, "Offline devices": offline }, { collapsed: false }).addTo(m);
      }
    },
    {
      title: "Marker Clustering",
      level: 2,
      desc: "400 points grouped into clusters that split apart as you zoom in. Keeps dense maps readable.",
      render(b) {
        const m = AX.map(b, { center: SYD, zoom: 9, height: 280 });
        const group = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 50 });
        cloud(400, 7).forEach(([lat, lng], i) => group.addLayer(L.marker([lat, lng]).bindPopup(`Meter M-${3000 + i}`)));
        m.addLayer(group);
      }
    },
    {
      title: "Heatmap Layer",
      level: 2,
      desc: "Density surface from 800 readings, weighted by intensity. Shows hot spots rather than individual points.",
      render(b) {
        const m = AX.map(b, { center: SYD, zoom: 10, height: 280 });
        L.heatLayer(cloud(800, 11), { radius: 22, blur: 18, maxZoom: 13, gradient: { 0.3: "#4f46e5", 0.55: "#0d9488", 0.75: "#f59e0b", 1: "#ef4444" } }).addTo(m);
      }
    },
    {
      title: "Status Filter",
      level: 2,
      desc: "Tick boxes show or hide devices by status, with live counts of what is on the map.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl">${Object.entries(AX.STATUS_COLOR).map(([s, c]) => `<label><input type="checkbox" value="${s}" checked> <span style="color:${c};font-weight:600">${s}</span> <span class="ax-muted">(${D.devices.filter(d => d.status === s).length})</span></label>`).join("")}</div>`);
        const m = AX.map(b, { height: 260 });
        const layers = {};
        Object.keys(AX.STATUS_COLOR).forEach(s => {
          layers[s] = L.layerGroup(D.devices.filter(d => d.status === s).map(d => L.marker([d.lat, d.lng], { icon: AX.dot(AX.STATUS_COLOR[s], 12) }).bindTooltip(`${d.id} · ${d.site}`))).addTo(m);
        });
        ctl.addEventListener("change", e => (e.target.checked ? layers[e.target.value].addTo(m) : layers[e.target.value].remove()));
      }
    },
    {
      title: "Search and Fly To",
      level: 2,
      desc: "Type a site or device name and the map flies to it and opens its popup.",
      render(b) {
        const items = [...D.sites.map(s => ({ label: s.name, ll: [s.lat, s.lng], zoom: 11, info: s.region })), ...D.devices.map(d => ({ label: `${d.id} ${d.name}`, ll: [d.lat, d.lng], zoom: 14, info: `${d.site} · ${d.status}` }))];
        const id = "ax-dl-" + Math.random().toString(36).slice(2);
        const ctl = AX.add(b, `<div class="ax-ctl"><input class="ax-input" list="${id}" placeholder="Search sites or devices..." style="flex:1" aria-label="Search"><datalist id="${id}">${items.map(i => `<option value="${i.label}">`).join("")}</datalist><button class="ax-btn ax-btn--primary">Go</button></div>`);
        const m = AX.map(b, { height: 250 });
        const markers = items.map(i => L.circleMarker(i.ll, { radius: 5, color: "#4f46e5" }).addTo(m).bindPopup(`<strong>${i.label}</strong><br>${i.info}`));
        const go = () => {
          const q = ctl.querySelector("input").value.toLowerCase(), i = items.findIndex(x => x.label.toLowerCase().includes(q));
          if (!q || i < 0) return AX.toast("No match found", "bad");
          m.flyTo(items[i].ll, items[i].zoom, { duration: 1.2 });
          m.once("moveend", () => markers[i].openPopup());
        };
        ctl.querySelector("button").addEventListener("click", go);
        ctl.querySelector("input").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      }
    },
    {
      title: "Asset Route",
      level: 2,
      desc: "A vehicle's trip drawn as a line with start and end markers and the total distance travelled.",
      render(b) {
        const pts = route([-33.87, 151.21], [-32.93, 151.78], 40, 3);
        const info = AX.add(b, `<div class="ax-ctl ax-small"></div>`);
        const m = AX.map(b, { height: 260 });
        const line = L.polyline(pts, { color: "#4f46e5", weight: 4 }).addTo(m);
        L.marker(pts[0], { icon: AX.dot("#10b981", 16) }).addTo(m).bindTooltip("Start 06:10");
        L.marker(pts[pts.length - 1], { icon: AX.dot("#ef4444", 16) }).addTo(m).bindTooltip("End 08:42");
        m.fitBounds(line.getBounds(), { padding: [20, 20] });
        const dist = pts.slice(1).reduce((a, p, i) => a + m.distance(pts[i], p), 0);
        info.innerHTML = `<span class="ax-pill ax-pill--info">Truck T-14</span> ${km(dist)} · 2 h 32 min · avg ${(dist / 1000 / 2.53).toFixed(0)} km/h`;
      }
    },
    {
      title: "Geofence",
      level: 2,
      desc: "A boundary drawn on the map. Devices inside and outside are coloured and counted automatically.",
      render(b) {
        const fence = [[-33.78, 151.05], [-33.75, 151.28], [-33.93, 151.32], [-34.0, 151.1]];
        const info = AX.add(b, `<div class="ax-ctl ax-small"></div>`);
        const m = AX.map(b, { center: SYD, zoom: 10, height: 260 });
        L.polygon(fence, { color: "#4f46e5", fillOpacity: 0.08, dashArray: "6 4" }).addTo(m).bindTooltip("Metro zone");
        const inside = ([y, x]) => { let c = false; for (let i = 0, j = fence.length - 1; i < fence.length; j = i++) { const [yi, xi] = fence[i], [yj, xj] = fence[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
        let n = 0;
        const pts = cloud(60, 21, 0.6);
        pts.forEach(([lat, lng], i) => { const ok = inside([lat, lng]); n += ok; L.marker([lat, lng], { icon: AX.dot(ok ? "#10b981" : "#a1a1aa", 11) }).addTo(m).bindTooltip(`Asset A-${i + 1}: ${ok ? "inside" : "outside"}`); });
        info.innerHTML = `<span class="ax-pill ax-pill--good">${n} inside</span><span class="ax-pill" style="background:#f0f0f2">${pts.length - n} outside</span>`;
      }
    },
    {
      title: "Zone Shading",
      level: 2,
      desc: "Map divided into zones coloured by a value (consumption per zone) with a colour legend.",
      render(b) {
        const scale = ["#eef0ff", "#c7d2fe", "#818cf8", "#4f46e5", "#312e81"];
        const r = D.rng(41), m = AX.map(b, { center: [-33.87, 151.1], zoom: 10, height: 260 });
        for (let i = 0; i < 6; i++) for (let j = 0; j < 7; j++) {
          const lat = -34.08 + i * 0.07, lng = 150.85 + j * 0.08, v = Math.round(r() * 100);
          L.rectangle([[lat, lng], [lat + 0.07, lng + 0.08]], { weight: 1, color: "#fff", fillColor: scale[Math.min(4, Math.floor(v / 20))], fillOpacity: 0.7 })
            .addTo(m).bindTooltip(`Zone ${String.fromCharCode(65 + i)}${j + 1}: ${v} MWh`);
        }
        const lg = L.control({ position: "bottomright" });
        lg.onAdd = () => AX.el(`<div style="background:#fff;padding:6px 8px;border-radius:6px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.2)">${scale.map((c, i) => `<div><span style="display:inline-block;width:12px;height:10px;background:${c};margin-right:5px"></span>${i * 20} to ${i * 20 + 20}</div>`).join("")}</div>`);
        lg.addTo(m);
      }
    },
    {
      title: "Radius Search",
      level: 3,
      desc: "Click anywhere to find devices within the chosen radius, listed nearest first.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl"><label>Radius <input type="range" min="2" max="40" value="10" aria-label="Radius km"></label><strong data-r>10 km</strong><span class="ax-small ax-muted">Click the map</span></div>`);
        const m = AX.map(b, { center: SYD, zoom: 9, height: 240 });
        const pts = cloud(150, 31, 0.8);
        pts.forEach(([lat, lng]) => L.circleMarker([lat, lng], { radius: 3, color: "#a1a1aa", weight: 1 }).addTo(m));
        const list = AX.add(b, `<ul class="ax-list ax-small" style="max-height:120px;overflow:auto;margin-top:8px"></ul>`);
        let circle, hits = L.layerGroup().addTo(m), centre = null;
        const run = () => {
          if (!centre) return;
          const rad = +ctl.querySelector("input").value * 1000;
          circle?.remove();
          circle = L.circle(centre, { radius: rad, color: "#4f46e5", fillOpacity: 0.08 }).addTo(m);
          hits.clearLayers();
          const found = pts.map(([lat, lng], i) => ({ i, d: m.distance(centre, [lat, lng]), ll: [lat, lng] })).filter(x => x.d <= rad).sort((a, z) => a.d - z.d);
          found.forEach(f => L.circleMarker(f.ll, { radius: 5, color: "#ef4444" }).addTo(hits));
          list.innerHTML = found.length ? found.slice(0, 20).map(f => `<li><span>Sensor S-${100 + f.i}</span><span class="ax-muted">${km(f.d)}</span></li>`).join("") + (found.length > 20 ? `<li class="ax-muted">and ${found.length - 20} more</li>` : "") : "<li class='ax-muted'>Nothing in range</li>";
          ctl.querySelector(".ax-small").textContent = `${found.length} found`;
        };
        m.on("click", e => { centre = e.latlng; run(); });
        ctl.querySelector("input").addEventListener("input", e => { ctl.querySelector("[data-r]").textContent = e.target.value + " km"; run(); });
      }
    },
    {
      title: "Distance Measure",
      level: 3,
      desc: "Click points on the map to draw a path. Shows each leg and the running total distance.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl"><strong data-t>0 km</strong><span class="ax-small ax-muted" data-n>Click the map to start</span><button class="ax-btn ax-btn--sm" data-undo style="margin-left:auto">Undo</button><button class="ax-btn ax-btn--sm" data-clear>Clear</button></div>`);
        const m = AX.map(b, { center: [-33.4, 151.2], zoom: 8, height: 260 });
        const pts = [], layer = L.layerGroup().addTo(m);
        const draw = () => {
          layer.clearLayers();
          let total = 0;
          pts.forEach((p, i) => {
            L.marker(p, { icon: AX.dot("#4f46e5", 12) }).addTo(layer);
            if (i) { const d = m.distance(pts[i - 1], p); total += d; L.polyline([pts[i - 1], p], { color: "#4f46e5", dashArray: "6 6" }).addTo(layer).bindTooltip(km(d), { permanent: true, direction: "center", className: "" }); }
          });
          ctl.querySelector("[data-t]").textContent = km(total);
          ctl.querySelector("[data-n]").textContent = pts.length ? `${pts.length} points, ${Math.max(0, pts.length - 1)} legs` : "Click the map to start";
        };
        m.on("click", e => { pts.push(e.latlng); draw(); });
        ctl.querySelector("[data-undo]").addEventListener("click", () => { pts.pop(); draw(); });
        ctl.querySelector("[data-clear]").addEventListener("click", () => { pts.length = 0; draw(); });
      }
    },
    {
      title: "Live Moving Assets",
      level: 3,
      desc: "Five vehicles update position every 2 seconds, leaving a fading trail. Click one to follow it.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl ax-small"><span class="ax-pill ax-pill--live">Live</span><span data-f>Click a vehicle to follow it</span><button class="ax-btn ax-btn--sm" data-stop hidden>Stop following</button></div>`);
        const m = AX.map(b, { center: SYD, zoom: 10, height: 270 });
        let follow = null;
        const fleet = Array.from({ length: 5 }, (_, i) => {
          const ll = [SYD[0] + (Math.random() - 0.5) * 0.3, SYD[1] + (Math.random() - 0.5) * 0.4];
          const v = { name: `Van V-${21 + i}`, ll, hd: Math.random() * Math.PI * 2, trail: [ll], color: AX.PALETTE[i] };
          v.line = L.polyline(v.trail, { color: v.color, weight: 3, opacity: 0.5 }).addTo(m);
          v.mk = L.marker(ll, { icon: AX.dot(v.color, 16) }).addTo(m).bindTooltip(v.name);
          v.mk.on("click", () => { follow = v; ctl.querySelector("[data-f]").textContent = `Following ${v.name}`; ctl.querySelector("[data-stop]").hidden = false; });
          return v;
        });
        ctl.querySelector("[data-stop]").addEventListener("click", e => { follow = null; e.target.hidden = true; ctl.querySelector("[data-f]").textContent = "Click a vehicle to follow it"; });
        AX.every(2000, () => fleet.forEach(v => {
          v.hd += (Math.random() - 0.5) * 0.8;
          v.ll = [v.ll[0] + Math.sin(v.hd) * 0.008, v.ll[1] + Math.cos(v.hd) * 0.01];
          v.trail = v.trail.concat([v.ll]).slice(-15);
          v.mk.setLatLng(v.ll);
          v.line.setLatLngs(v.trail);
          if (follow === v) m.panTo(v.ll);
        }), b);
      }
    },
    {
      title: "Route Playback",
      level: 3,
      desc: "Replay a recorded trip: play, pause, scrub the timeline and change speed. Shows time and speed at each point.",
      render(b) {
        const pts = route([-37.81, 144.96], [-38.15, 144.36], 120, 9);
        const t0 = Date.now() - 3 * D.HOUR, speeds = D.walk(120, { base: 62, vol: 6, min: 0, max: 100, seed: 4 });
        const ctl = AX.add(b, `<div class="ax-ctl"><button class="ax-btn ax-btn--primary" data-play style="width:70px">Play</button>
          <input type="range" min="0" max="${pts.length - 1}" value="0" style="flex:1" aria-label="Timeline">
          <select class="ax-select" aria-label="Speed"><option value="1">1x</option><option value="3" selected>3x</option><option value="8">8x</option></select></div>`);
        const info = AX.add(b, `<div class="ax-small" style="margin-bottom:8px"></div>`);
        const m = AX.map(b, { height: 250 });
        L.polyline(pts, { color: "#a1a1aa", weight: 3 }).addTo(m);
        const done = L.polyline([], { color: "#4f46e5", weight: 4 }).addTo(m);
        const car = L.marker(pts[0], { icon: AX.dot("#4f46e5", 18) }).addTo(m);
        m.fitBounds(pts, { padding: [20, 20] });
        const slider = ctl.querySelector("input[type=range]"), btn = ctl.querySelector("[data-play]");
        let i = 0, playing = false, acc = 0;
        const go = k => {
          i = k; slider.value = k; car.setLatLng(pts[k]); done.setLatLngs(pts.slice(0, k + 1));
          info.innerHTML = `<strong>${F.time(t0 + k * 90e3)}</strong> · ${Math.round(speeds[k])} km/h · point ${k + 1} of ${pts.length}`;
        };
        slider.addEventListener("input", () => go(+slider.value));
        btn.addEventListener("click", () => { playing = !playing; if (i >= pts.length - 1) go(0); btn.textContent = playing ? "Pause" : "Play"; });
        AX.every(100, () => {
          if (!playing) return;
          acc += +ctl.querySelector("select").value;
          if (acc < 3) return;
          acc = 0;
          if (i >= pts.length - 1) { playing = false; btn.textContent = "Play"; return; }
          go(i + 1);
        }, b);
        go(0);
      }
    },
    {
      title: "Map and Table Linked",
      level: 3,
      wide: true,
      desc: "Click a table row to locate it on the map, or click a marker to highlight its row. Two views, one selection.",
      render(b) {
        const devs = D.devices.filter(d => d.region === "NSW");
        const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:3fr 2fr;gap:12px"></div>`);
        const m = AX.map(AX.add(wrap, "<div></div>"), { height: 320 });
        const tbl = AX.add(wrap, `<div class="ax-table-wrap" style="max-height:320px"><table class="ax-table ax-table--hover ax-table--compact"><thead><tr><th>Device</th><th>Site</th><th>Status</th></tr></thead><tbody>${devs.map((d, i) => `<tr data-i="${i}" style="cursor:pointer"><td>${d.id}</td><td>${d.site.split(" ")[0]}</td><td>${AX.pill(d.status)}</td></tr>`).join("")}</tbody></table></div>`);
        const mks = devs.map((d, i) => L.marker([d.lat, d.lng], { icon: AX.dot(AX.STATUS_COLOR[d.status], 12) }).addTo(m).bindPopup(`<strong>${d.id}</strong> ${d.name}<br>${d.temp}°C · ${d.power} kW`).on("click", () => select(i, false)));
        m.fitBounds(devs.map(d => [d.lat, d.lng]), { padding: [20, 20] });
        const select = (i, fly) => {
          tbl.querySelectorAll("tr").forEach(tr => tr.classList.toggle("is-selected", tr.dataset.i === String(i)));
          const row = tbl.querySelector(`tr[data-i="${i}"]`);
          row.scrollIntoView({ block: "nearest" });
          if (fly) { m.flyTo(mks[i].getLatLng(), 13, { duration: 0.8 }); m.once("moveend", () => mks[i].openPopup()); }
        };
        tbl.addEventListener("click", e => { const tr = e.target.closest("tr[data-i]"); if (tr) select(+tr.dataset.i, true); });
      }
    },
    {
      title: "Time Slider",
      level: 3,
      desc: "Drag through the hours of the day, or press play, to watch readings change across every site.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl"><button class="ax-btn ax-btn--primary" style="width:70px">Play</button><input type="range" min="0" max="23" value="8" style="flex:1" aria-label="Hour"><strong data-h></strong></div>`);
        const m = AX.map(b, { height: 270 });
        const circles = D.sites.map((s, i) => ({ s, vals: D.wave(24, { base: 50, amp: 35, period: 24, noise: 6, seed: i + 3, phase: -6 + (s.lng - 140) / 15 }), c: L.circleMarker([s.lat, s.lng], { weight: 2 }).addTo(m) }));
        const slider = ctl.querySelector("input"), btn = ctl.querySelector("button");
        let playing = false;
        const draw = h => {
          ctl.querySelector("[data-h]").textContent = D.hours[h];
          circles.forEach(({ s, vals, c }) => {
            const v = Math.max(0, vals[h]);
            c.setRadius(4 + v / 4).setStyle({ color: v > 70 ? "#ef4444" : v > 40 ? "#f59e0b" : "#4f46e5", fillOpacity: 0.4 }).bindTooltip(`${s.name}: ${v.toFixed(0)} MW at ${D.hours[h]}`);
          });
        };
        slider.addEventListener("input", () => draw(+slider.value));
        btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; });
        AX.every(700, () => { if (playing) { slider.value = (+slider.value + 1) % 24; draw(+slider.value); } }, b);
        draw(8);
      }
    },
    {
      title: "Indoor Floor Plan",
      level: 3,
      desc: "A building floor plan instead of a world map. Rooms are shaded by temperature, sensors are clickable.",
      render(b) {
        const m = AX.map(b, { base: null, height: 290, options: { crs: L.CRS.Simple, minZoom: -1, maxZoom: 2, zoomSnap: 0.25, attributionControl: false } });
        const rooms = [["Office A", 0, 0, 40, 30], ["Office B", 40, 0, 80, 30], ["Meeting", 80, 0, 110, 30], ["Open plan", 0, 40, 70, 80], ["Server room", 70, 40, 90, 60], ["Kitchen", 90, 40, 110, 60], ["Store", 70, 60, 110, 80]];
        const r = D.rng(17), col = t => (t > 26 ? "#fca5a5" : t > 23 ? "#fcd34d" : t > 20 ? "#6ee7b7" : "#93c5fd");
        L.rectangle([[-5, -5], [85, 115]], { color: "#a1a1aa", weight: 3, fill: false }).addTo(m);
        L.rectangle([[30, 0], [40, 110]], { color: "#e4e4e7", weight: 0, fillColor: "#f4f4f5", fillOpacity: 1 }).addTo(m).bindTooltip("Corridor");
        rooms.forEach(([name, x0, y0, x1, y1]) => {
          const t = +(name === "Server room" ? 27.5 : 19 + r() * 7).toFixed(1);
          L.rectangle([[y0, x0], [y1, x1]], { color: "#d4d4d8", weight: 2, fillColor: col(t), fillOpacity: 0.45 }).addTo(m).bindTooltip(`${name}`, { permanent: true, direction: "center", className: "ax-room" });
          L.marker([(y0 + y1) / 2 - 6, (x0 + x1) / 2], { icon: AX.dot("#18181b", 10) }).addTo(m).bindPopup(`<strong>${name} sensor</strong><br>${t}°C · ${Math.round(35 + r() * 25)}% RH · CO₂ ${Math.round(450 + r() * 500)} ppm`);
        });
        m.fitBounds([[-5, -5], [85, 115]]);
        b.insertAdjacentHTML("beforeend", legend([["#93c5fd", "< 20°"], ["#6ee7b7", "20 to 23°"], ["#fcd34d", "23 to 26°"], ["#fca5a5", "> 26°"]]));
      }
    },
    {
      title: "Fleet Dashboard Map",
      level: 3,
      wide: true,
      desc: "Clustered devices with status filter and search. The KPI strip recalculates for whatever area is in view.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg([["", "All"], ["Online", "Online"], ["Warning", "Warning"], ["Offline", "Offline"]], "")}<input class="ax-input" placeholder="Filter by name, type or site..." style="flex:1;max-width:280px" aria-label="Filter"><button class="ax-btn" data-reset>Reset view</button></div>`);
        const kpis = AX.add(b, `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px"></div>`);
        const m = AX.map(b, { height: 330 });
        const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40 }).addTo(m);
        let status = "", rows = [];
        const draw = () => {
          const q = ctl.querySelector("input").value.toLowerCase();
          rows = D.devices.filter(d => (!status || d.status === status) && (!q || `${d.id} ${d.name} ${d.type} ${d.site}`.toLowerCase().includes(q)));
          cluster.clearLayers();
          rows.forEach(d => cluster.addLayer(L.marker([d.lat, d.lng], { icon: AX.dot(AX.STATUS_COLOR[d.status], 13) }).bindPopup(`<strong>${d.id}</strong> ${d.name}<br>${d.site}<br>${AX.pill(d.status)} ${d.temp}°C · ${d.power} kW`)));
          stats();
        };
        const stats = () => {
          const bounds = m.getBounds(), vis = rows.filter(d => bounds.contains([d.lat, d.lng]));
          kpis.innerHTML = [["In view", vis.length], ["Online", vis.filter(d => d.status === "Online").length], ["Need attention", vis.filter(d => d.status !== "Online").length], ["Total kW", F.num(vis.reduce((a, d) => a + d.power, 0), 0)], ["Open alerts", vis.reduce((a, d) => a + d.alerts, 0)]]
            .map(([l, v]) => `<div style="background:var(--rv-bg);border-radius:7px;padding:6px 10px"><div class="ax-small ax-muted">${l}</div><strong style="font-size:16px">${v}</strong></div>`).join("");
        };
        m.on("moveend", stats);
        AX.onSeg(ctl.querySelector(".ax-seg"), v => { status = v; draw(); });
        ctl.querySelector("input").addEventListener("input", draw);
        ctl.querySelector("[data-reset]").addEventListener("click", () => m.setView([-29, 140], 4));
        draw();
      }
    }
  ]);
})();
</script>
<script>
/* ==========================================================================
 * Tables: 20 examples, simple to advanced
 * ========================================================================== */
(() => {
  const COLS = {
    id: { key: "id", label: "Device" },
    name: { key: "name", label: "Name" },
    type: { key: "type", label: "Type" },
    site: { key: "site", label: "Site" },
    region: { key: "region", label: "Region" },
    status: { key: "status", label: "Status", fmt: v => AX.pill(v) },
    temp: { key: "temp", label: "Temp °C", num: true, fmt: v => F.num(v, 1) },
    humidity: { key: "humidity", label: "Humidity %", num: true },
    power: { key: "power", label: "Power kW", num: true, fmt: v => F.num(v, 1) },
    battery: { key: "battery", label: "Battery %", num: true },
    uptime: { key: "uptime", label: "Uptime %", num: true, fmt: v => F.num(v, 2) },
    alerts: { key: "alerts", label: "Alerts", num: true },
    lastSeen: { key: "lastSeen", label: "Last seen", num: true, fmt: v => (v >= 60 ? `${Math.floor(v / 60)} h ago` : `${v} min ago`) }
  };
  const cols = (...keys) => keys.map(k => COLS[k]);

  const cell = (c, r) => (c.fmt ? c.fmt(r[c.key], r) : F.esc(r[c.key]));
  const sortRows = (rows, key, dir) => [...rows].sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * dir);

  /* Basic table markup. opts: cls, sort {key, dir}, wrapStyle, rowAttr(r, i), lead(r)/leadHead (extra first column), foot (html) */
  function table(rows, columns, o = {}) {
    const th = columns.map(c => `<th data-key="${c.key}" class="${c.num ? "num" : ""} ${o.sort ? "is-sortable" : ""}" ${o.sort ? `aria-sort="${o.sort.key === c.key ? (o.sort.dir > 0 ? "ascending" : "descending") : "none"}"` : ""} scope="col">${c.label}</th>`).join("");
    const body = rows.length
      ? rows.map((r, i) => `<tr ${o.rowAttr ? o.rowAttr(r, i) : ""}>${o.lead ? `<td>${o.lead(r, i)}</td>` : ""}${columns.map(c => `<td class="${c.num ? "num" : ""}" ${c.style ? `style="${c.style(r[c.key], r)}"` : ""}>${cell(c, r)}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${columns.length + (o.lead ? 1 : 0)}" class="ax-empty">No matching rows</td></tr>`;
    return `<div class="ax-table-wrap" style="${o.wrapStyle || ""}"><table class="ax-table ax-table--hover ${o.cls || ""}"><thead><tr>${o.lead ? `<th>${o.leadHead || ""}</th>` : ""}${th}</tr></thead><tbody>${body}</tbody>${o.foot || ""}</table></div>`;
  }

  /* Wire sortable headers in `root`: calls back with the new sort state */
  function onSort(root, sort, redraw) {
    root.addEventListener("click", e => {
      const th = e.target.closest("th.is-sortable");
      if (!th) return;
      sort.dir = sort.key === th.dataset.key ? -sort.dir : 1;
      sort.key = th.dataset.key;
      redraw();
    });
  }

  const sparkline = (vals, color = "#4f46e5", w = 90, h = 24) => {
    const lo = Math.min(...vals), hi = Math.max(...vals), sx = w / (vals.length - 1);
    const pts = vals.map((v, i) => `${(i * sx).toFixed(1)},${(h - 2 - ((v - lo) / (hi - lo || 1)) * (h - 4)).toFixed(1)}`).join(" ");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
  };

  const siteSummary = () => D.sites.map(s => {
    const devs = D.devices.filter(d => d.site === s.name);
    return { site: s.name, region: s.region, devices: devs.length, power: +devs.reduce((a, d) => a + d.power, 0).toFixed(1), alerts: devs.reduce((a, d) => a + d.alerts, 0), uptime: +(devs.reduce((a, d) => a + d.uptime, 0) / devs.length).toFixed(2) };
  });

  AX.section("tables", [
    {
      title: "Basic Table",
      level: 1,
      desc: "A plain list of records with a header row. Good for small, fixed sets of data.",
      render(b) {
        b.innerHTML = table(D.sites, [{ key: "id", label: "Code" }, { key: "name", label: "Site" }, { key: "region", label: "Region" }, { key: "lat", label: "Lat", num: true }, { key: "lng", label: "Lng", num: true }]);
      }
    },
    {
      title: "Striped and Compact",
      level: 1,
      desc: "Toggle zebra stripes and compact row height to fit more data or improve readability.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl"><label><input type="checkbox" data-c="ax-table--striped" checked> Striped</label><label><input type="checkbox" data-c="ax-table--compact"> Compact</label></div>`);
        const box = AX.add(b, "<div></div>");
        const draw = () => { box.innerHTML = table(D.devices.slice(0, 8), cols("id", "name", "site", "temp"), { cls: [...ctl.querySelectorAll("input:checked")].map(i => i.dataset.c).join(" ") }); };
        ctl.addEventListener("change", draw);
        draw();
      }
    },
    {
      title: "Sortable Columns",
      level: 1,
      desc: "Click any column heading to sort, click again to reverse. Text and numbers sort correctly.",
      render(b) {
        const sort = { key: "temp", dir: -1 };
        const draw = () => { b.innerHTML = table(sortRows(D.devices.slice(0, 10), sort.key, sort.dir), cols("id", "type", "temp", "battery"), { sort }); };
        onSort(b, sort, draw);
        draw();
      }
    },
    {
      title: "Quick Search",
      level: 1,
      desc: "Type to filter rows across every column. Matching text is highlighted.",
      render(b) {
        const input = AX.add(b, `<div class="ax-ctl"><input class="ax-input" type="search" placeholder="Try 'pump' or 'Perth'..." style="flex:1" aria-label="Search"><span class="ax-small ax-muted" data-n></span></div>`).querySelector("input");
        const box = AX.add(b, "<div></div>");
        const draw = () => {
          const q = input.value.trim().toLowerCase();
          const hl = v => (q ? F.esc(v).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) : F.esc(v));
          const rows = D.devices.filter(d => !q || `${d.id} ${d.name} ${d.site} ${d.status}`.toLowerCase().includes(q));
          box.innerHTML = table(rows.slice(0, 8), ["id", "name", "site"].map(k => ({ ...COLS[k], fmt: hl })).concat(COLS.status), { wrapStyle: "max-height:260px" });
          b.querySelector("[data-n]").textContent = `${rows.length} of ${D.devices.length}`;
        };
        input.addEventListener("input", draw);
        draw();
      }
    },
    {
      title: "Pagination",
      level: 2,
      desc: "Splits long lists into pages. Choose the page size and jump between pages.",
      render(b) {
        let page = 0, size = 5;
        const box = AX.add(b, "<div></div>");
        const pager = AX.add(b, `<div class="ax-pager"></div>`);
        const draw = () => {
          const pages = Math.ceil(D.devices.length / size);
          page = Math.min(page, pages - 1);
          box.innerHTML = table(D.devices.slice(page * size, page * size + size), cols("id", "name", "site", "status"));
          const nums = Array.from({ length: pages }, (_, i) => i).filter(i => i < 2 || i >= pages - 2 || Math.abs(i - page) <= 1);
          pager.innerHTML = `
            <span>Rows <select class="ax-select" aria-label="Rows per page">${[5, 10, 20].map(n => `<option ${n === size ? "selected" : ""}>${n}</option>`).join("")}</select> · ${page * size + 1} to ${Math.min(D.devices.length, (page + 1) * size)} of ${D.devices.length}</span>
            <span class="ax-row" style="gap:4px"><button class="ax-btn ax-btn--sm" data-p="${page - 1}" ${page ? "" : "disabled"}>‹</button>
            ${nums.map((n, i) => `${i && n - nums[i - 1] > 1 ? "…" : ""}<button class="ax-btn ax-btn--sm ${n === page ? "ax-btn--primary" : ""}" data-p="${n}">${n + 1}</button>`).join("")}
            <button class="ax-btn ax-btn--sm" data-p="${page + 1}" ${page < pages - 1 ? "" : "disabled"}>›</button></span>`;
        };
        pager.addEventListener("click", e => { if (e.target.dataset.p) { page = +e.target.dataset.p; draw(); } });
        pager.addEventListener("change", e => { size = +e.target.value; page = 0; draw(); });
        draw();
      }
    },
    {
      title: "Conditional Formatting",
      level: 2,
      desc: "Cells change colour based on rules: high temperature, low battery, poor uptime and open alerts.",
      render(b) {
        const rule = (bad, warn) => v => (bad(v) ? "background:var(--rv-bad-soft);color:var(--rv-bad);font-weight:600" : warn(v) ? "background:var(--rv-warn-soft);color:#b45309" : "");
        b.innerHTML = table(D.devices.slice(10, 20), [
          COLS.id, COLS.status,
          { ...COLS.temp, style: rule(v => v > 30, v => v > 27) },
          { ...COLS.battery, style: rule(v => v < 20, v => v < 40) },
          { ...COLS.uptime, style: rule(v => v < 90, v => v < 97) },
          { ...COLS.alerts, style: rule(v => v >= 4, v => v >= 1) }
        ]) + `<div class="ax-ctl ax-small" style="margin-top:8px"><span class="ax-pill ax-pill--bad">Critical</span><span class="ax-pill ax-pill--warn">Warning</span></div>`;
      }
    },
    {
      title: "Totals and Formatting",
      level: 2,
      desc: "Units, thousands separators and a footer with totals and averages calculated from the rows.",
      render(b) {
        const rows = siteSummary();
        const sum = k => rows.reduce((a, r) => a + r[k], 0);
        b.innerHTML = table(rows, [{ key: "site", label: "Site" }, { key: "devices", label: "Devices", num: true }, { key: "power", label: "Power", num: true, fmt: v => `${F.num(v, 1)} kW` }, { key: "alerts", label: "Alerts", num: true }, { key: "uptime", label: "Uptime", num: true, fmt: v => `${F.num(v, 2)}%` }], {
          foot: `<tfoot><tr><td>Total / avg</td><td class="num">${sum("devices")}</td><td class="num">${F.num(sum("power"), 1)} kW</td><td class="num">${sum("alerts")}</td><td class="num">${F.num(sum("uptime") / rows.length, 2)}%</td></tr></tfoot>`
        });
      }
    },
    {
      title: "Data Bars",
      level: 2,
      desc: "A bar behind each value makes the column scannable like a chart while keeping exact numbers.",
      render(b) {
        const rows = siteSummary(), max = Math.max(...rows.map(r => r.power));
        const bar = (pct, c, label) => `<div style="position:relative;min-width:140px"><div style="position:absolute;inset:2px auto 2px 0;width:${Math.max(0, Math.min(100, pct))}%;background:${c};border-radius:3px;opacity:.25"></div><span style="position:relative;padding-left:4px">${label}</span></div>`;
        b.innerHTML = table(sortRows(rows, "power", -1), [
          { key: "site", label: "Site" },
          { key: "power", label: "Power kW", fmt: v => bar((v / max) * 100, "#4f46e5", F.num(v, 1)) },
          { key: "uptime", label: "Uptime % (scale 90 to 100)", fmt: v => bar((v - 90) * 10, "#0d9488", F.num(v, 2)) }
        ]);
      }
    },
    {
      title: "Sparklines in Cells",
      level: 2,
      desc: "A tiny 7-day trend in each row, plus the change, so you see direction as well as the current value.",
      render(b) {
        const rows = D.devices.slice(0, 8).map((d, i) => {
          const t = D.walk(14, { base: d.power, vol: 2, min: 0, seed: i + 200 });
          return { ...d, trend: t, change: +(((t[13] - t[0]) / t[0]) * 100).toFixed(1) };
        });
        b.innerHTML = table(rows, [COLS.id, COLS.name, { key: "trend", label: "Power, 7 days", fmt: (v, r) => sparkline(v, r.change >= 0 ? "#10b981" : "#ef4444") }, { key: "change", label: "Change", num: true, fmt: v => `<span class="${v >= 0 ? "ax-up" : "ax-down"}">${v >= 0 ? "+" : ""}${v}%</span>` }]);
      }
    },
    {
      title: "Column Filters",
      level: 2,
      desc: "A filter under each heading: text match, status dropdown and numeric minimums, all combined.",
      render(b) {
        const filters = { id: "", site: "", status: "", temp: "", battery: "" };
        const head = `<tr class="ax-filter-row">
          <th><input class="ax-input" data-f="id" placeholder="Contains" style="width:90px"></th>
          <th><input class="ax-input" data-f="site" placeholder="Contains" style="width:110px"></th>
          <th><select class="ax-select" data-f="status"><option value="">All</option><option>Online</option><option>Warning</option><option>Offline</option></select></th>
          <th class="num"><input class="ax-input" data-f="temp" type="number" placeholder="Min" style="width:70px"></th>
          <th class="num"><input class="ax-input" data-f="battery" type="number" placeholder="Max" style="width:70px"></th></tr>`;
        const box = AX.add(b, "<div></div>");
        const draw = () => {
          const rows = D.devices.filter(d =>
            (!filters.id || d.id.toLowerCase().includes(filters.id.toLowerCase())) && (!filters.site || d.site.toLowerCase().includes(filters.site.toLowerCase())) &&
            (!filters.status || d.status === filters.status) && (filters.temp === "" || d.temp >= +filters.temp) && (filters.battery === "" || d.battery <= +filters.battery));
          box.querySelector("tbody").innerHTML = rows.length ? rows.map(r => `<tr><td>${r.id}</td><td>${r.site}</td><td>${AX.pill(r.status)}</td><td class="num">${r.temp}</td><td class="num">${r.battery}</td></tr>`).join("") : '<tr><td colspan="5" class="ax-empty">No matching rows</td></tr>';
          box.querySelector("[data-n]").textContent = `${rows.length} rows`;
        };
        box.innerHTML = `<div class="ax-table-wrap" style="max-height:300px"><table class="ax-table ax-table--hover ax-table--compact"><thead><tr><th>Device</th><th>Site</th><th>Status</th><th class="num">Temp ≥</th><th class="num">Battery ≤</th></tr>${head}</thead><tbody></tbody></table></div><div class="ax-pager"><span data-n></span><button class="ax-btn ax-btn--sm" data-clear>Clear filters</button></div>`;
        box.querySelectorAll(".ax-filter-row th").forEach(th => { th.style.top = "33px"; });

        box.addEventListener("change", e => {
          if (e.target.dataset.all !== undefined) { const view = filtered().slice(st.page * st.size, (st.page + 1) * st.size); view.forEach(r => (e.target.checked ? st.sel.add(r.id) : st.sel.delete(r.id))); }
          if (e.target.dataset.id) e.target.checked ? st.sel.add(e.target.dataset.id) : st.sel.delete(e.target.dataset.id);
          draw();
        });
        pager.addEventListener("click", e => { if (e.target.dataset.p) { st.page = +e.target.dataset.p; draw(); } });
        pager.addEventListener("change", e => { st.size = +e.target.value; st.page = 0; draw(); });
        ctl.querySelector("[data-export]").addEventListener("click", () => {
          const rows = st.sel.size ? D.devices.filter(d => st.sel.has(d.id)) : filtered();
          AX.download("devices.csv", AX.csv(rows, all.filter(k => st.show.has(k)).map(k => COLS[k])));
          AX.toast(`Exported ${rows.length} rows`, "good");
        });
        draw();
      }
    }
  ]);
})();
</script>
<script>
/* ==========================================================================
 * Bar + Pie Charts: 20 examples, simple to advanced
 * ========================================================================== */
(() => {
  const sum = a => a.reduce((s, v) => s + v, 0);
  const siteKw = () => D.sites.map(s => ({ name: s.name, id: s.id, value: +sum(D.devices.filter(d => d.site === s.name).map(d => d.power)).toFixed(1) }));
  const monthly = (seed, base = 40000, amp = 7000) => D.wave(12, { base, amp, period: 12, noise: 2500, seed, phase: 9 }).map(Math.round);

  AX.section("barpie", [
    {
      title: "Column Chart",
      level: 1,
      desc: "Vertical bars for comparing values across a small number of categories or periods.",
      render(b) {
        AX.chart(b, { xAxis: { type: "category", data: D.months }, yAxis: { type: "value", name: "kWh" }, series: [{ type: "bar", name: "Consumption", data: monthly(1) }] });
      }
    },
    {
      title: "Sorted Horizontal Bars",
      level: 1,
      desc: "Horizontal bars ranked highest first. Best when labels are long or there are many categories.",
      render(b) {
        const rows = siteKw().sort((a, z) => a.value - z.value);
        AX.chart(b, {
          xAxis: { type: "value", name: "kW" }, yAxis: { type: "category", data: rows.map(r => r.name) },
          series: [{ type: "bar", name: "Power", data: rows.map(r => r.value), itemStyle: { borderRadius: [0, 3, 3, 0] }, label: { show: true, position: "right", fontSize: 10 } }]
        }, 260);
      }
    },
    {
      title: "Pie Chart",
      level: 1,
      desc: "Part-to-whole for a handful of categories. Hover a slice for its value and share.",
      render(b) {
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: "{b}: {c} ({d}%)" }, legend: { bottom: 0 },
          series: [{ type: "pie", radius: "68%", center: ["50%", "45%"], data: ["Online", "Warning", "Offline"].map(s => ({ name: s, value: D.devices.filter(d => d.status === s).length, itemStyle: { color: AX.STATUS_COLOR[s] } })) }]
        }, 250);
      }
    },
    {
      title: "Donut with Centre Total",
      level: 1,
      desc: "A ring chart with the overall total in the middle, so you get the whole and the parts together.",
      render(b) {
        const data = D.types.map(t => ({ name: t, value: D.devices.filter(d => d.type === t).length }));
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: "{b}: {c} ({d}%)" }, legend: { right: 0, top: "middle", orient: "vertical" },
          graphic: [{ type: "text", left: "31%", top: "42%", style: { text: String(D.devices.length), fontSize: 28, fontWeight: 700, fill: "#18181b", textAlign: "center" } },
                    { type: "text", left: "31%", top: "56%", style: { text: "devices", fontSize: 12, fill: "#71717a", textAlign: "center" } }],
          series: [{ type: "pie", radius: ["50%", "75%"], center: ["35%", "50%"], label: { show: false }, data }]
        }, 250);
      }
    },
    {
      title: "Grouped Bars",
      level: 2,
      desc: "Bars side by side per category to compare series directly, here this year against last year.",
      render(b) {
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: D.months.slice(0, 6) }, yAxis: { type: "value", name: "kWh" },
          series: [{ type: "bar", name: "Last year", data: monthly(2).slice(0, 6), itemStyle: { color: "#c7d2fe" } }, { type: "bar", name: "This year", data: monthly(3, 38000).slice(0, 6) }]
        });
      }
    },
    {
      title: "Stacked Bars",
      level: 2,
      desc: "Each bar split into parts. Shows totals and composition together, such as energy by end use.",
      render(b) {
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: D.sites.map(s => s.id) }, yAxis: { type: "value", name: "MWh" },
          series: [["HVAC", 4], ["Production", 5], ["Lighting", 6], ["Other", 7]].map(([name, seed], i) => ({
            type: "bar", name, stack: "t", data: D.walk(8, { base: 30 - i * 6, vol: 6, min: 2, seed }), itemStyle: { borderRadius: i === 3 ? [3, 3, 0, 0] : 0 }
          }))
        });
      }
    },
    {
      title: "100% Stacked Bars",
      level: 2,
      desc: "Every bar scaled to 100% so you compare the mix between categories, regardless of size.",
      render(b) {
        const parts = ["Online", "Warning", "Offline"];
        const pct = s => parts.map(p => { const all = D.devices.filter(d => d.site === s.name); return +((all.filter(d => d.status === p).length / all.length) * 100).toFixed(1); });
        const rows = D.sites.map(pct);
        AX.chart(b, {
          legend: { top: 0 }, tooltip: { trigger: "axis", valueFormatter: v => v + "%" },
          xAxis: { type: "value", max: 100, axisLabel: { formatter: "{value}%" } }, yAxis: { type: "category", data: D.sites.map(s => s.id) },
          series: parts.map((p, i) => ({ type: "bar", name: p, stack: "s", data: rows.map(r => r[i]), itemStyle: { color: AX.STATUS_COLOR[p], borderRadius: 0 } }))
        }, 260);
      }
    },
    {
      title: "Variance Bars",
      level: 2,
      desc: "Positive and negative bars around zero, coloured by direction. Shows over and under budget clearly.",
      render(b) {
        const v = D.wave(12, { base: 0, amp: 9, period: 7, noise: 6, seed: 12 }).map(x => +x.toFixed(1));
        AX.chart(b, {
          tooltip: { trigger: "axis", valueFormatter: x => (x > 0 ? "+" : "") + x + "%" },
          xAxis: { type: "category", data: D.months }, yAxis: { type: "value", axisLabel: { formatter: "{value}%" } },
          series: [{ type: "bar", name: "vs budget", data: v.map(x => ({ value: x, itemStyle: { color: x >= 0 ? "#ef4444" : "#10b981", borderRadius: x >= 0 ? [3, 3, 0, 0] : [0, 0, 3, 3] } })) }]
        });
      }
    },
    {
      title: "Target Line and Thresholds",
      level: 2,
      desc: "Bars coloured by how they perform against a target, with the target drawn across the chart.",
      render(b) {
        const target = 85, data = [92, 78, 88, 64, 95, 83, 71, 90];
        AX.chart(b, {
          xAxis: { type: "category", data: D.sites.map(s => s.id) }, yAxis: { type: "value", max: 100, name: "OEE %" },
          series: [{
            type: "bar", name: "OEE", data: data.map(v => ({ value: v, itemStyle: { color: v >= target ? "#4f46e5" : v >= target - 10 ? "#f59e0b" : "#ef4444" } })), // colour only flags a miss
            label: { show: true, position: "top", fontSize: 10 },
            markLine: { symbol: "none", label: { formatter: "Target {c}%", position: "insideEndTop", fontSize: 10 }, lineStyle: { color: "#18181b", type: "dashed" }, data: [{ yAxis: target }] }
          }]
        });
      }
    },
    {
      title: "Waterfall",
      level: 2,
      desc: "How a starting value becomes an ending value through increases and decreases along the way.",
      render(b) {
        const steps = [["Opening", 1200, "total"], ["Solar", 340], ["Battery", 120], ["HVAC", -460], ["Production", -380], ["Lighting", -90], ["Closing", null, "total"]];
        let run = 0;
        const base = [], up = [], down = [];
        steps.forEach(([, v, kind], i) => {
          if (kind === "total") { const t = i ? run : v; base.push(0); up.push({ value: t, itemStyle: { color: "#4f46e5" } }); down.push("-"); run = t; return; }
          if (v >= 0) { base.push(run); up.push(v); down.push("-"); run += v; } else { run += v; base.push(run); up.push("-"); down.push(-v); }
        });
        AX.chart(b, {
          tooltip: { trigger: "axis", formatter: p => { const s = p.filter(x => x.seriesIndex > 0 && x.value !== "-")[0]; return s ? `${s.name}: ${s.seriesIndex === 2 ? "−" : ""}${s.value} kWh` : ""; } },
          xAxis: { type: "category", data: steps.map(s => s[0]), axisLabel: { interval: 0, fontSize: 10 } }, yAxis: { type: "value", name: "kWh" },
          series: [
            { type: "bar", stack: "w", data: base, itemStyle: { color: "transparent" }, silent: true },
            { type: "bar", stack: "w", name: "Increase", data: up, itemStyle: { color: "#10b981" }, label: { show: true, position: "top", fontSize: 10, formatter: p => (p.value === "-" ? "" : p.value) } },
            { type: "bar", stack: "w", name: "Decrease", data: down, itemStyle: { color: "#ef4444" }, label: { show: true, position: "bottom", fontSize: 10, formatter: p => (p.value === "-" ? "" : "−" + p.value) } }
          ]
        });
      }
    },
    {
      title: "Pareto Chart",
      level: 2,
      desc: "Causes sorted largest first with a cumulative percentage line, showing the vital few behind most issues.",
      render(b) {
        const causes = [["Comms loss", 62], ["Overheating", 41], ["Low battery", 33], ["Sensor drift", 18], ["Power dip", 12], ["Door open", 7], ["Other", 5]];
        const total = sum(causes.map(c => c[1]));
        let acc = 0;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: causes.map(c => c[0]), axisLabel: { interval: 0, rotate: 20, fontSize: 10 } },
          yAxis: [{ type: "value", name: "Alerts" }, { type: "value", max: 100, axisLabel: { formatter: "{value}%" }, splitLine: { show: false } }],
          series: [
            { type: "bar", name: "Alerts", data: causes.map(c => c[1]) },
            { type: "line", name: "Cumulative %", yAxisIndex: 1, symbol: "circle", symbolSize: 6, data: causes.map(c => +((acc += c[1]) / total * 100).toFixed(1)), itemStyle: { color: "#ef4444" },
              markLine: { symbol: "none", silent: true, label: { formatter: "80%", fontSize: 10 }, lineStyle: { type: "dotted", color: "#71717a" }, data: [{ yAxis: 80 }] } }
          ]
        }, 260);
      }
    },
    {
      title: "Nightingale Rose",
      level: 2,
      desc: "A pie where slice radius, not angle, shows the value. Eye-catching for cyclical categories like months.",
      render(b) {
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: "{b}: {c} kWh" },
          series: [{ type: "pie", roseType: "area", radius: [16, "88%"], itemStyle: { borderRadius: 4 }, label: { fontSize: 10, color: "#71717a" }, labelLine: { lineStyle: { color: "#e0e0e5" } },
            // One hue, opacity by value: the radius already encodes size, colour just reinforces it
            data: (vals => { const lo = Math.min(...vals), hi = Math.max(...vals); return D.months.map((m, i) => ({ name: m, value: vals[i], itemStyle: { color: "#4f46e5", opacity: 0.3 + 0.7 * ((vals[i] - lo) / (hi - lo)) } })); })(monthly(5)) }]
        }, 270);
      }
    },
    {
      title: "Half Donut",
      level: 2,
      desc: "A semicircle ring that saves vertical space. Good for budget split or capacity used versus remaining.",
      render(b) {
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: p => (p.name ? `${p.name}: ${p.value} MWh (${(p.percent * 2).toFixed(0)}%)` : "") },
          legend: { bottom: 0 },
          graphic: [{ type: "group", left: "center", top: "56%", children: [{ type: "text", style: { text: "1,840", fontSize: 24, fontWeight: 600, fill: "#18181b", textAlign: "center", x: 0, y: 0 } }, { type: "text", style: { text: "MWh capacity", fontSize: 11.5, fill: "#a1a1aa", textAlign: "center", x: 0, y: 30 } }] }],
          series: [{
            type: "pie", radius: ["60%", "95%"], center: ["50%", "75%"], startAngle: 180, label: { show: false },
            data: [{ name: "Used", value: 1240 }, { name: "Reserved", value: 310 }, { name: "Available", value: 290, itemStyle: { color: "#f2f2f4" } }, { value: 1840, itemStyle: { color: "none" }, tooltip: { show: false }, label: { show: false } }]
          }]
        }, 230);
      }
    },
    {
      title: "Nested Pie",
      level: 2,
      desc: "Inner ring shows regions, outer ring breaks each region into its sites. Two levels in one view.",
      render(b) {
        const regions = [...new Set(D.sites.map(s => s.region))], kw = siteKw();
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: "{b}: {c} kW ({d}%)" },
          series: [
            { type: "pie", radius: [0, "38%"], label: { position: "inner", fontSize: 11, color: "#fff" }, data: regions.map(r => ({ name: r, value: +sum(kw.filter(k => D.sites.find(s => s.id === k.id).region === r).map(k => k.value)).toFixed(1) })) },
            { type: "pie", radius: ["48%", "72%"], label: { fontSize: 10 }, data: regions.flatMap((r, ri) => kw.filter(k => D.sites.find(s => s.id === k.id).region === r).map((k, j) => ({ name: k.id, value: k.value, itemStyle: { color: AX.PALETTE[ri], opacity: 1 - j * 0.3 } }))) }
          ]
        }, 280);
      }
    },
    {
      title: "Histogram",
      level: 3,
      desc: "Distribution of 500 readings in bins. Change the bin count to see more or less detail.",
      render(b) {
        const r = D.rng(61), vals = Array.from({ length: 500 }, () => 22 + (r() + r() + r() + r() - 2) * 6);
        const ctl = AX.add(b, `<div class="ax-ctl"><label>Bins <input type="range" min="4" max="40" value="14" aria-label="Bins"></label><strong data-n>14</strong><span class="ax-small ax-muted">mean ${(sum(vals) / vals.length).toFixed(1)}°C</span></div>`);
        const c = AX.chart(b, { xAxis: { type: "category", name: "°C" }, yAxis: { type: "value", name: "Readings" }, series: [{ type: "bar", name: "Readings", barCategoryGap: "4%", itemStyle: { borderRadius: 2 } }] }, 230);
        const draw = n => {
          const lo = Math.min(...vals), w = (Math.max(...vals) - lo) / n, counts = Array(n).fill(0);
          vals.forEach(v => { counts[Math.min(n - 1, Math.floor((v - lo) / w))]++; });
          ctl.querySelector("[data-n]").textContent = n;
          c.setOption({ xAxis: { data: counts.map((_, i) => (lo + i * w).toFixed(1)) }, series: [{ data: counts }] });
        };
        ctl.querySelector("input").addEventListener("input", e => draw(+e.target.value));
        draw(14);
      }
    },
    {
      title: "Pie with 'Other' Grouping",
      level: 3,
      desc: "Small slices below your threshold are merged into 'Other' so the pie stays readable. Click legend items to exclude.",
      render(b) {
        const raw = D.devices.slice(0, 18).map(d => ({ name: d.id, value: d.power }));
        const ctl = AX.add(b, `<div class="ax-ctl"><label>Group slices under <input type="range" min="0" max="10" value="4" step="0.5" aria-label="Threshold"></label><strong data-t></strong><span class="ax-small ax-muted" data-o></span></div>`);
        const c = AX.chart(b, { tooltip: { trigger: "item", formatter: p => (p.data.parts ? `Other (${p.data.parts} devices): ${F.num(p.value, 1)} kW` : `${p.name}: ${p.value} kW (${p.percent}%)`) }, legend: { type: "scroll", bottom: 0 }, series: [{ type: "pie", radius: ["30%", "65%"], center: ["50%", "44%"], label: { fontSize: 10 } }] }, 280);
        const draw = th => {
          const total = sum(raw.map(r => r.value)), big = raw.filter(r => (r.value / total) * 100 >= th), small = raw.filter(r => (r.value / total) * 100 < th);
          const data = big.sort((a, z) => z.value - a.value).concat(small.length ? [{ name: "Other", value: +sum(small.map(s => s.value)).toFixed(1), parts: small.length, itemStyle: { color: "#a1a1aa" } }] : []);
          ctl.querySelector("[data-t]").textContent = th + "%";
          ctl.querySelector("[data-o]").textContent = `${big.length} slices + ${small.length} grouped`;
          c.setOption({ series: [{ data }] });
        };
        ctl.querySelector("input").addEventListener("input", e => draw(+e.target.value));
        draw(4);
      }
    },
    {
      title: "Top N with Metric Picker",
      level: 3,
      desc: "Choose the measure, top or bottom, and how many to show. The ranking rebuilds instantly.",
      render(b) {
        const metrics = [["power", "Power kW"], ["temp", "Temperature °C"], ["alerts", "Alerts"], ["battery", "Battery %"], ["uptime", "Uptime %"]];
        const ctl = AX.add(b, `<div class="ax-ctl"><select class="ax-select" data-k="m" aria-label="Metric">${metrics.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>${AX.seg([["top", "Top"], ["bottom", "Bottom"]], "top")}<select class="ax-select" data-k="n" aria-label="How many"><option>5</option><option selected>10</option><option>15</option></select></div>`);
        const c = AX.chart(b, { xAxis: { type: "value" }, yAxis: { type: "category", inverse: true }, series: [{ type: "bar", itemStyle: { borderRadius: [0, 3, 3, 0] }, label: { show: true, position: "right", fontSize: 10 } }] }, 300);
        let dir = "top";
        const draw = () => {
          const m = ctl.querySelector('[data-k="m"]').value, n = +ctl.querySelector('[data-k="n"]').value;
          const rows = [...D.devices].sort((a, z) => (dir === "top" ? z[m] - a[m] : a[m] - z[m])).slice(0, n);
          c.setOption({ xAxis: { name: metrics.find(x => x[0] === m)[1], scale: m === "uptime" }, yAxis: { data: rows.map(r => `${r.id} ${r.name}`) }, series: [{ name: m, data: rows.map(r => r[m]), itemStyle: { color: dir === "top" ? "#4f46e5" : "#f59e0b" } }] });
        };
        ctl.addEventListener("change", draw);
        AX.onSeg(ctl.querySelector(".ax-seg"), v => { dir = v; draw(); });
        draw();
      }
    },
    {
      title: "Drill-Down Bars",
      level: 3,
      desc: "Click a region bar to see its sites, then a site to see its devices. Breadcrumbs take you back up.",
      render(b) {
        const crumbs = AX.add(b, `<div class="ax-ctl ax-small"></div>`);
        const c = AX.chart(b, { xAxis: { type: "category", axisLabel: { interval: 0, fontSize: 10 } }, yAxis: { type: "value", name: "kW" }, series: [{ type: "bar", name: "Power", colorBy: "data", universalTransition: true }] }, 250);
        let path = [];
        const level = () => {
          if (!path.length) return [...new Set(D.sites.map(s => s.region))].map(r => [r, sum(D.devices.filter(d => d.region === r).map(d => d.power))]);
          if (path.length === 1) return D.sites.filter(s => s.region === path[0]).map(s => [s.name, sum(D.devices.filter(d => d.site === s.name).map(d => d.power))]);
          return D.devices.filter(d => d.site === path[1]).map(d => [d.id, d.power]);
        };
        const draw = () => {
          const rows = level();
          crumbs.innerHTML = ["All regions", ...path].map((p, i) => (i < path.length ? `<a href="#" data-i="${i}" style="color:var(--rv-primary)">${p}</a> ›` : `<strong>${p}</strong>`)).join(" ") + (path.length < 2 ? ' <span class="ax-muted">· click a bar to drill down</span>' : "");
          c.setOption({ xAxis: { data: rows.map(r => r[0]) }, series: [{ data: rows.map(r => +r[1].toFixed(1)) }] });
        };
        c.on("click", p => { if (path.length < 2) { path.push(p.name); draw(); } });
        crumbs.addEventListener("click", e => { if (e.target.dataset.i) { e.preventDefault(); path = path.slice(0, +e.target.dataset.i); draw(); } });
        draw();
      }
    },
    {
      title: "Bar Race",
      level: 3,
      desc: "Animated ranking as cumulative totals grow month by month. Bars reorder as leaders change.",
      render(b) {
        const series = D.sites.map((s, i) => ({ id: s.id, vals: monthly(i + 70, 3000 + i * 300, 1800) }));
        const ctl = AX.add(b, `<div class="ax-ctl"><button class="ax-btn ax-btn--primary" style="width:70px">Play</button><strong data-m></strong></div>`);
        const c = AX.chart(b, {
          xAxis: { type: "value", max: "dataMax" }, yAxis: { type: "category", inverse: true, animationDuration: 300, animationDurationUpdate: 300, data: series.map(s => s.id) },
          series: [{ type: "bar", realtimeSort: true, colorBy: "data", label: { show: true, position: "right", valueAnimation: true, fontSize: 10 }, itemStyle: { borderRadius: [0, 3, 3, 0] } }],
          animationDuration: 0, animationDurationUpdate: 900, animationEasing: "linear", animationEasingUpdate: "linear"
        }, 270);
        let m = 0, playing = false;
        const draw = () => {
          ctl.querySelector("[data-m]").textContent = `Year to date: ${D.months[m]}`;
          c.setOption({ series: [{ data: series.map(s => sum(s.vals.slice(0, m + 1))) }] });
        };
        const btn = ctl.querySelector("button");
        btn.addEventListener("click", () => { playing = !playing; if (playing && m === 11) { m = 0; draw(); } btn.textContent = playing ? "Pause" : "Play"; });
        AX.every(1000, () => { if (!playing) return; if (m >= 11) { playing = false; btn.textContent = "Replay"; return; } m++; draw(); }, b);
        draw();
      }
    },
    {
      title: "Linked Bar and Pie",
      level: 3,
      wide: true,
      desc: "Click a site bar to break the pie down for that site; click a pie slice to filter the bars by device type.",
      render(b) {
        let site = null, type = null;
        const info = AX.add(b, `<div class="ax-ctl"></div>`);
        const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:3fr 2fr;gap:12px"></div>`);
        const bar = AX.chart(AX.add(wrap, "<div></div>"), { xAxis: { type: "category", data: D.sites.map(s => s.id) }, yAxis: { type: "value", name: "kW" }, series: [{ type: "bar", name: "Power" }] }, 270);
        const pie = AX.chart(AX.add(wrap, "<div></div>"), { tooltip: { trigger: "item", formatter: "{b}: {c} kW ({d}%)" }, series: [{ type: "pie", radius: ["38%", "70%"], label: { fontSize: 10 } }] }, 270);
        const draw = () => {
          const pool = D.devices.filter(d => !type || d.type === type);
          bar.setOption({ series: [{ data: D.sites.map(s => ({ value: +sum(pool.filter(d => d.site === s.name).map(d => d.power)).toFixed(1), itemStyle: { color: site && site !== s.id ? "#e0e7ff" : type ? AX.PALETTE[D.types.indexOf(type)] : "#4f46e5" } })) }] });
          const pp = D.devices.filter(d => !site || d.siteId === site);

        info.addEventListener("click", e => { if (e.target.dataset.clear !== undefined) { site = type = null; draw(); } });
        draw();
      }
    }
  ]);
})();

      title: "Alert Rule Builder",

        const matches = () => D.devices.filter(d => {

          return rule.join === "AND" ? res.every(Boolean) : res.some(Boolean);

          if (c && e.target.dataset.k) rule.conditions[+c.dataset.c][e.target.dataset.k] = e.target.dataset.k === "value" ? +e.target.value : e.target.value;
