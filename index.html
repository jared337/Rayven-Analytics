          title: { text: "Alarms per 10 min, last 12 h", textStyle: { fontSize: 12 }, left: 0, top: 0 },
          grid: { left: 4, right: 12, top: 30, bottom: 4, containLabel: true },
          xAxis: { type: "time" }, yAxis: { type: "value", minInterval: 1 },
          series: [{
            type: "bar", name: "Alarms", barMaxWidth: 6, data: rate.map((v, i) => ({ value: [now - (71 - i) * 10 * MIN, v], itemStyle: { color: v >= 10 ? "#ef4444" : v > 1 ? "#a5b4fc" : "#4f46e5" } })),
            markLine: { symbol: "none", silent: true, label: { formatter: "{b}", position: "insideEndTop", fontSize: 10 }, data: [
              { name: "Target 1", yAxis: 1, lineStyle: { color: "#10b981", type: "dashed" } },
              { name: "Flood 10", yAxis: 10, lineStyle: { color: "#ef4444", type: "dashed" } }] }
          }]
        }, 170);
        const mix = () => {
          const live = alarms.filter(a => !a.ack), n = live.length || 1;
          const target = { 1: 5, 2: 15, 3: 80 };
          b.querySelector("[data-mix]").innerHTML = [1, 2, 3].map(p => {
            const pc = Math.round((live.filter(a => a.p === p).length / n) * 100);
            return `<div style="margin-bottom:10px"><div class="ax-row ax-row--between ax-small"><span>${pri[p][0]}</span><span><strong>${pc}%</strong> <span style="color:var(--ink-3)">target ${target[p]}%</span></span></div>
              <div style="position:relative" class="ax-bar"><div style="width:${pc}%;background:${pc > target[p] * 1.5 ? "var(--warn)" : "var(--accent)"}"></div></div>
              <div style="position:relative;height:0"><span style="position:absolute;left:${target[p]}%;top:-8px;width:2px;height:8px;background:#18181b"></span></div></div>`;
          }).join("");
        };
        let view = "active";
        const draw = () => {
          const t = Date.now();
          const shelved = alarms.filter(a => a.shelvedUntil > t);
          const active = alarms.filter(a => a.shelvedUntil <= t);
          const standing = active.filter(a => t - a.at > DAY);
          const list = view === "shelved" ? shelved : view === "standing" ? standing : active;
          const avg = (rate.reduce((s, v) => s + v, 0) / rate.length).toFixed(1);
          b.querySelector("[data-kpis]").innerHTML = [
            ["Avg rate / 10 min", avg, +avg > 1 ? "warn" : "ok"], ["Floods (12 h)", rate.filter(v => v >= 10).length, "bad"],
            ["Unacknowledged", active.filter(a => !a.ack).length, "info"], ["Standing", standing.length, standing.length ? "warn" : "ok"]
          ].map(([l, v, tone]) => `<div style="background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px"><div class="ax-small" style="color:var(--ink-2)">${l}</div><div style="font-size:20px;font-weight:600;color:var(--${tone === "info" ? "ink" : tone})">${v}</div></div>`).join("");
          b.querySelector("[data-list]").innerHTML = list.length ? list.map(a => {
            const mins = Math.round((t - a.at) / MIN);
            return `<li style="opacity:${a.ack ? 0.55 : 1}"><span class="ax-row" style="gap:10px"><span class="ax-pill ax-pill--${pri[a.p][1]}">${pri[a.p][0]}</span><span>${a.t}<br><span class="ax-small" style="color:var(--ink-3)">${a.src} · ${mins >= 1440 ? Math.floor(mins / 1440) + " d" : mins >= 60 ? Math.floor(mins / 60) + " h" : mins + " min"} ago${a.ack ? " · acknowledged" : ""}</span></span></span>
              <span class="ax-row" style="gap:6px">${view === "shelved" ? `<span class="ax-small" style="color:var(--ink-3)">until ${F.time(a.shelvedUntil)}</span><button class="ax-btn ax-btn--sm" data-unshelve="${a.i}">Unshelve</button>`
                : `${a.ack ? "" : `<button class="ax-btn ax-btn--sm" data-ack="${a.i}">Ack</button>`}<select class="ax-select" data-shelve="${a.i}" style="height:28px;font-size:12px" aria-label="Shelve"><option value="">Shelve...</option><option value="1">1 hour</option><option value="8">8 hours</option><option value="24">24 hours</option></select>`}</span></li>`;
          }).join("") : '<li style="color:var(--ink-3)">Nothing here</li>';
          mix();
        };
        b.addEventListener("click", e => {
          const s = e.target.closest(".ax-seg button");
          if (s) { b.querySelectorAll(".ax-seg button").forEach(x => x.classList.toggle("is-active", x === s)); view = s.dataset.v; draw(); }
          if (e.target.dataset.ack) { alarms[+e.target.dataset.ack].ack = true; draw(); }
          if (e.target.dataset.unshelve) { alarms[+e.target.dataset.unshelve].shelvedUntil = 0; draw(); }
        });
        b.addEventListener("change", e => {
          if (!e.target.dataset.shelve || !e.target.value) return;
          const a = alarms[+e.target.dataset.shelve];
          a.shelvedUntil = Date.now() + +e.target.value * HOUR;
          AX.toast(`${a.t} shelved for ${e.target.value} h`);
          draw();
        });
        draw();
      }
    }
  ]);

  AX.extend("timeseries", [
    {
      title: "Data Gaps and Quality",
      level: 3,
      desc: "Real telemetry has holes. Comms outages show as shaded gaps, estimated values as dashed, bad readings as red points. Toggle gap filling.",
      render(b) {
        const n = 168, raw = D.wave(n, { base: 120, amp: 25, noise: 6, seed: 707 });
        const t0 = Math.floor(Date.now() / HOUR) * HOUR - (n - 1) * HOUR, T = i => t0 + i * HOUR;
        const gap = [[40, 52], [118, 123]], est = [80, 92], bad = [27, 63, 101, 140];
        const inGap = i => gap.some(([a, z]) => i >= a && i <= z);
        const good = raw.map((v, i) => [T(i), inGap(i) || (i > est[0] && i < est[1]) ? null : v]);
        const estimated = raw.map((v, i) => [T(i), i >= est[0] && i <= est[1] ? +(v * 0.97).toFixed(1) : null]);
        const badPts = bad.map(i => [T(i), +(raw[i] * 1.6).toFixed(1)]);
        const pctGood = Math.round(((n - gap.reduce((s, [a, z]) => s + z - a + 1, 0) - (est[1] - est[0] + 1) - bad.length) / n) * 100);
        b.innerHTML = `<div class="ax-ctl">
          <span class="ax-pill ax-pill--good">${pctGood}% good</span><span class="ax-pill ax-pill--info">${est[1] - est[0] + 1} h estimated</span>
          <span class="ax-pill ax-pill--bad">${gap.reduce((s, [a, z]) => s + z - a + 1, 0)} h missing · ${bad.length} bad</span>
          <label style="margin-left:auto"><input type="checkbox" data-fill> Fill gaps (linear)</label></div>`;
        const opt = fill => ({
          legend: { top: 0, data: ["Good", "Estimated", "Bad reading"] },
          xAxis: { type: "time" }, yAxis: { type: "value", name: "L/s", scale: true },
          series: [
            { type: "line", name: "Good", data: good, connectNulls: fill, lineStyle: fill ? { width: 2.2 } : undefined,
              markArea: { silent: true, itemStyle: { color: "rgba(161,161,170,.13)" }, label: { color: "#a1a1aa", fontSize: 10 }, data: gap.map(([a, z]) => [{ name: "Comms lost", xAxis: T(a) }, { xAxis: T(z) }]) } },
            { type: "line", name: "Estimated", data: estimated, lineStyle: { type: "dashed", color: "#a5b4fc" }, itemStyle: { color: "#a5b4fc" } },
            { type: "scatter", name: "Bad reading", data: badPts, symbol: "path://M2,2 L10,10 M10,2 L2,10", symbolSize: 9, itemStyle: { color: "#ef4444", borderColor: "#ef4444", borderWidth: 2 } }
          ]
        });
        const c = AX.chart(b, opt(false), 250);
        b.querySelector("[data-fill]").addEventListener("change", e => c.setOption(opt(e.target.checked), true));
      }
    },
    {
      title: "Equipment State Timeline",
      level: 3,
      wide: true,
      desc: "Ten assets over seven days, coloured by state. Availability is calculated per asset. Zoom to any shift, hover a block for its duration.",
      render(b) {
        const states = [["Running", "#4f46e5"], ["Standby", "#c7d2fe"], ["Planned maintenance", "#f59e0b"], ["Breakdown", "#ef4444"]];
        const assets = ["Crusher 1", "Crusher 2", "Conveyor CV-01", "Conveyor CV-02", "Mill A", "Mill B", "Pump P-101", "Pump P-102", "Thickener", "Stacker"];
        const end = Date.now(), start = end - 7 * DAY, data = [], down = [];
        assets.forEach((a, ai) => {
          const r = D.rng(ai * 31 + 5);
          let t = start, s = 0, lost = 0;
          while (t < end) {
            const roll = r();
            s = s !== 0 ? 0 : roll < 0.08 ? 3 : roll < 0.16 ? 2 : roll < 0.45 ? 1 : 0;
            const dur = (s === 0 ? 6 + r() * 30 : s === 1 ? 1 + r() * 5 : s === 2 ? 4 + r() * 6 : 1 + r() * 7) * HOUR;
            const z = Math.min(end, t + dur);
            data.push({ value: [ai, t, z, s], itemStyle: { color: states[s][1] } });
            if (s >= 2) lost += z - t;
            t = z;
          }
          down.push(Math.round((1 - lost / (end - start)) * 1000) / 10);
        });
        b.innerHTML = `<div class="ax-ctl">${states.map(([n, c]) => `<span class="ax-row" style="gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:${c}"></span>${n}</span>`).join("")}</div>`;
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: p => `<b>${assets[p.value[0]]}</b><br>${states[p.value[3]][0]}<br>${F.dateTime(p.value[1])} to ${F.dateTime(p.value[2])}<br>${((p.value[2] - p.value[1]) / HOUR).toFixed(1)} h` },
          grid: { left: 4, right: 70, top: 6, bottom: 46, containLabel: true },
          dataZoom: [{ type: "inside", filterMode: "weakFilter" }, { type: "slider", height: 20, bottom: 6, filterMode: "weakFilter" }],
          xAxis: { type: "time", min: start, max: end },
          yAxis: [
            { type: "category", data: assets, inverse: true, axisLabel: { color: "#52525b", fontSize: 11.5 } },
            { type: "category", data: down.map(v => v + "%"), inverse: true, position: "right", axisLine: { show: false }, axisLabel: { color: "#18181b", fontWeight: 600, fontSize: 11.5, formatter: v => v }, name: "Avail.", nameTextStyle: { color: "#a1a1aa" } }
          ],
          series: [{
            type: "custom", data, encode: { x: [1, 2], y: 0 },
            renderItem(params, api) {
              const a = api.coord([api.value(1), api.value(0)]), z = api.coord([api.value(2), api.value(0)]), h = api.size([0, 1])[1] * 0.62;
              const rect = echarts.graphic.clipRectByRect({ x: a[0], y: a[1] - h / 2, width: Math.max(1, z[0] - a[0] - 0.5), height: h },
                { x: params.coordSys.x, y: params.coordSys.y, width: params.coordSys.width, height: params.coordSys.height });
              return rect && { type: "rect", shape: { ...rect, r: 2 }, style: { fill: api.visual("color") } };
            }
          }]
        }, 380);
      }
    }
  ]);
})();
</script>
<script>
/* ==========================================================================
 * Mining: 12 domain components, simple to advanced
 * ========================================================================== */
(() => {
  const HOUR = D.HOUR, DAY = D.DAY;
  const sum = a => a.reduce((s, v) => s + v, 0);
  const tile = (l, v, sub, tone = "") => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div class="ax-kpi__label">${l}</div><div style="font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums">${v}</div><div class="ax-small" style="color:${tone ? `var(--${tone})` : "var(--ink-3)"}">${sub}</div></div>`;

  /* Mine fleet used by several components */
  const fleet = [
    ...Array.from({ length: 12 }, (_, i) => ({ id: `HT${String(i + 1).padStart(2, "0")}`, kind: "Haul truck", cap: 220 })),
    ...Array.from({ length: 3 }, (_, i) => ({ id: `EX0${i + 1}`, kind: "Excavator", cap: 0 })),
    ...Array.from({ length: 3 }, (_, i) => ({ id: `DZ0${i + 1}`, kind: "Dozer", cap: 0 })),
    ...Array.from({ length: 2 }, (_, i) => ({ id: `DR0${i + 1}`, kind: "Drill", cap: 0 }))
  ];

  AX.section("mining", [
    {
      title: "Shift Production",
      level: 1,
      desc: "The numbers a superintendent checks first: tonnes moved, ore milled, head grade and recovery against shift plan.",
      render(b) {
        const k = [["Material moved", 48210, 52000, "t"], ["Ore milled", 9840, 10000, "t"], ["Head grade", 1.84, 1.75, "g/t"], ["Recovery", 91.2, 92.5, "%"]];
        b.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${k.map(([l, v, p, u]) => {
          const pct = (v / p) * 100, good = pct >= 98;
          return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px">
            <div class="ax-kpi__label">${l}</div>
            <div style="font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums">${F.num(v, v < 100 ? 2 : 0)}<span class="ax-kpi__unit">${u}</span></div>
            <div class="ax-bar" style="margin:6px 0 4px"><div style="width:${Math.min(100, pct)}%;background:${good ? "var(--accent)" : "var(--warn)"}"></div></div>
            <div class="ax-small" style="color:var(--ink-3)">Plan ${F.num(p, p < 100 ? 2 : 0)} · <span class="${good ? "ax-up" : "ax-down"}">${pct >= 100 ? "+" : ""}${(pct - 100).toFixed(1)}%</span></div></div>`;
        }).join("")}</div><div class="ax-small" style="color:var(--ink-3);margin-top:10px">Day shift · 06:00 to 18:00 · 9 h 40 min elapsed</div>`;
      }
    },
    {
      title: "Fleet Status Board",
      level: 1,
      desc: "Every machine and what it is doing right now, with counts by state. The view dispatch keeps open all shift.",
      render(b) {
        const st = { Hauling: "#4f46e5", Loading: "#818cf8", Queued: "#f59e0b", Down: "#ef4444", Standby: "#d4d4d8" };
        const r = D.rng(91), keys = Object.keys(st);
        const rows = fleet.map(f => ({ ...f, s: f.kind === "Haul truck" ? keys[Math.floor(r() ** 1.6 * 5)] : r() < 0.15 ? "Down" : r() < 0.3 ? "Standby" : "Loading" }));
        b.innerHTML = `<div class="ax-ctl">${keys.map(k => `<span class="ax-row" style="gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:${st[k]}"></span>${k} <strong style="color:var(--ink)">${rows.filter(x => x.s === k).length}</strong></span>`).join("")}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px">${rows.map(x => `
            <div title="${x.kind} ${x.id}: ${x.s}" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;border-left:3px solid ${st[x.s]}">
              <div style="font-size:12.5px;font-weight:600">${x.id}</div><div class="ax-small" style="color:var(--ink-3);font-size:11px">${x.s}</div></div>`).join("")}</div>`;
      }
    },
    {
      title: "Tonnes vs Plan",
      level: 2,
      desc: "Cumulative month-to-date tonnes against plan, with a run-rate forecast to month end and the gap to close.",
      render(b) {
        const days = 30, today = 19, plan = Array.from({ length: days }, (_, i) => Math.round(((i + 1) / days) * 1500));
        const daily = D.walk(today, { base: 47, vol: 6, min: 25, seed: 12 });
        let acc = 0;
        const actual = daily.map(v => (acc += v));
        const rate = acc / today, fc = Array.from({ length: days }, (_, i) => (i < today - 1 ? null : Math.round(acc + rate * (i - today + 1))));
        const gap = plan[days - 1] - fc[days - 1];
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">Month to date <strong>${F.num(acc)} kt</strong> vs plan <strong>${F.num(plan[today - 1])} kt</strong></span>
          <span class="ax-pill ax-pill--${gap > 0 ? "warn" : "good"}">${gap > 0 ? `Forecast ${F.num(gap)} kt short` : "On track"}</span>
          <span class="ax-small" style="color:var(--ink-3)">Need ${F.num((plan[days - 1] - acc) / (days - today), 1)} kt/day vs ${F.num(rate, 1)} run rate</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: plan.map((_, i) => i + 1), name: "Day" }, yAxis: { type: "value", name: "kt" },
          series: [
            { type: "line", name: "Plan", data: plan, lineStyle: { color: "#a1a1aa", type: "dashed" }, itemStyle: { color: "#a1a1aa" } },
            { type: "line", name: "Actual", data: actual, areaStyle: {}, lineStyle: { width: 2.5 } },
            { type: "line", name: "Forecast", data: fc, lineStyle: { color: "#f59e0b", type: "dotted", width: 2 }, itemStyle: { color: "#f59e0b" } }
          ]
        }, 240);
      }
    },
    {
      title: "Time Usage Model",
      level: 2,
      desc: "Calendar time broken down to productive hours the way mines report it, with each loss category shown as a step down.",
      render(b) {
        const steps = [["Calendar", 720, 1], ["Scheduled down", -36], ["Unscheduled down", -58], ["Available", 0, 1], ["Standby", -41], ["Operating delay", -63], ["Productive", 0, 1]];
        let run = 0;
        const base = [], val = [], labels = [];
        steps.forEach(([n, v, total]) => {
          labels.push(n);
          if (total) { const t = v || run; run = t; base.push(0); val.push({ value: t, itemStyle: { color: "#4f46e5" } }); }
          else { run += v; base.push(run); val.push({ value: -v, itemStyle: { color: "#fca5a5" } }); }
        });
        const pct = (n, d) => ((n / d) * 100).toFixed(1);
        const avail = 720 - 94, prod = avail - 104;
        b.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
          ${tile("Availability", pct(avail, 720) + "%", "Available / calendar")}${tile("Utilisation", pct(prod, avail) + "%", "Productive / available")}${tile("Effective use", pct(prod, 720) + "%", "Productive / calendar")}</div>`;
        AX.chart(b, {
          tooltip: { trigger: "axis", formatter: p => `${p[1].name}: ${p[1].value} h` },
          xAxis: { type: "category", data: labels, axisLabel: { interval: 0, fontSize: 10, rotate: 18 } }, yAxis: { type: "value", name: "h" },
          series: [{ type: "bar", stack: "w", data: base, itemStyle: { color: "transparent" }, silent: true },
            { type: "bar", stack: "w", data: val, barMaxWidth: 36, label: { show: true, position: "top", fontSize: 10, color: "#52525b" } }]
        }, 230);
      }
    },
    {
      title: "Downtime by Reason",
      level: 2,
      desc: "Pareto of downtime hours by reason code with MTBF and MTTR. Filter by fleet to see where reliability effort should go.",
      render(b) {
        const data = {
          "Haul trucks": [["Tyres", 64], ["Engine", 48], ["Electrical", 31], ["Hydraulics", 22], ["Body / tray", 14], ["Other", 9]],
          Excavators: [["Hydraulics", 52], ["Ground engaging tools", 38], ["Electrical", 20], ["Slew ring", 16], ["Other", 6]],
          "Fixed plant": [["Liners", 70], ["Conveyor belt", 44], ["Blockages", 33], ["Electrical", 18], ["Other", 8]]
        };
        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg(Object.keys(data).map(k => [k, k]), "Haul trucks")}</div>`);
        const kp = AX.add(b, `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px"></div>`);
        const c = AX.chart(b, { xAxis: { type: "category" }, yAxis: [{ type: "value", name: "h" }, { type: "value", max: 100, axisLabel: { formatter: "{value}%" }, splitLine: { show: false } }], series: [] }, 220);
        const draw = k => {
          const rows = data[k], total = sum(rows.map(r => r[1]));
          let acc = 0;
          kp.innerHTML = tile("Downtime", total + " h", "Last 30 days") + tile("MTBF", (720 / (total / 6)).toFixed(0) + " h", "Mean time between failures") + tile("MTTR", (total / 31).toFixed(1) + " h", "Mean time to repair");
          c.setOption({ xAxis: { data: rows.map(r => r[0]), axisLabel: { interval: 0, fontSize: 10 } }, series: [
            { type: "bar", name: "Hours", data: rows.map(r => r[1]) },
            { type: "line", name: "Cumulative", yAxisIndex: 1, symbol: "circle", showSymbol: true, symbolSize: 5, itemStyle: { color: "#f59e0b" }, data: rows.map(r => +((acc += r[1]) / total * 100).toFixed(1)) }
          ] }, { replaceMerge: ["series"] });
        };
        draw("Haul trucks");
        AX.onSeg(ctl.querySelector(".ax-seg"), draw);
      }
    },
    {
      title: "Haul Cycle Breakdown",
      level: 2,
      desc: "Each truck's average cycle split into queue, load, haul, dump and return. Queue time exposes shovel and dump bottlenecks.",
      render(b) {
        const phases = [["Queue", "#f59e0b"], ["Load", "#818cf8"], ["Haul loaded", "#4f46e5"], ["Dump", "#a5b4fc"], ["Return empty", "#c7d2fe"]];
        const trucks = fleet.filter(f => f.kind === "Haul truck").slice(0, 8);
        const rows = trucks.map((t, i) => { const r = D.rng(i + 50); return [1 + r() * 6, 2.5 + r(), 9 + r() * 4, 1 + r() * 0.6, 7 + r() * 3].map(v => +v.toFixed(1)); });
        const avg = (sum(rows.map(r => sum(r))) / rows.length).toFixed(1);
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">Average cycle <strong>${avg} min</strong> · target 24.0 min</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: v => v + " min" },
          xAxis: { type: "value", name: "min" }, yAxis: { type: "category", data: trucks.map(t => t.id), inverse: true },
          series: phases.map(([n, c], pi) => ({ type: "bar", name: n, stack: "c", barMaxWidth: 16, data: rows.map(r => r[pi]), itemStyle: { color: c, borderRadius: 0 } }))
        }, 280);
      }
    },
    {
      title: "Payload Distribution",
      level: 2,
      desc: "Truck payloads against rated capacity using the 10/10/20 rule: no more than 10% of loads over 110%, none over 120%.",
      render(b) {
        const r = D.rng(77), loads = Array.from({ length: 600 }, () => 220 * (0.97 + (r() + r() + r() - 1.5) * 0.14));
        const bins = Array.from({ length: 24 }, (_, i) => 160 + i * 5);
        const counts = bins.map(x => loads.filter(l => l >= x && l < x + 5).length);
        const over110 = loads.filter(l => l > 242).length / loads.length * 100, over120 = loads.filter(l => l > 264).length;
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">Mean <strong>${F.num(sum(loads) / loads.length, 1)} t</strong> (${(sum(loads) / loads.length / 2.2).toFixed(1)}% of rated)</span>
          <span class="ax-pill ax-pill--${over110 > 10 ? "bad" : "good"}">${over110.toFixed(1)}% over 110%</span><span class="ax-pill ax-pill--${over120 ? "bad" : "good"}">${over120} over 120%</span></div>`;
        AX.chart(b, {
          xAxis: { type: "category", data: bins.map(String), name: "t", axisLabel: { interval: 3 } }, yAxis: { type: "value", name: "Loads" },
          series: [{ type: "bar", barCategoryGap: "8%", data: counts.map((v, i) => ({ value: v, itemStyle: { color: bins[i] >= 264 ? "#ef4444" : bins[i] >= 242 ? "#f59e0b" : "#4f46e5", borderRadius: 2 } })),
            markLine: { symbol: "none", silent: true, label: { formatter: "{b}", fontSize: 10, position: "end" }, data: [
              { name: "Rated", xAxis: "220", lineStyle: { color: "#18181b" } }, { name: "110%", xAxis: "240", lineStyle: { color: "#f59e0b", type: "dashed" } }, { name: "120%", xAxis: "265", lineStyle: { color: "#ef4444", type: "dashed" } }] } }]
        }, 220);
      }
    },
    {
      title: "Stockpile Inventory",
      level: 2,
      desc: "ROM and product stockpiles with tonnes, grade and days of feed remaining at the current mill rate.",
      render(b) {
        const piles = [["ROM high grade", 182000, 260000, 2.4], ["ROM low grade", 412000, 500000, 0.9], ["Crushed ore", 38000, 60000, 1.8], ["Product (conc.)", 14200, 25000, 24.5]];
        const mill = 9800;
        b.innerHTML = piles.map(([n, t, cap, g]) => {
          const pct = t / cap * 100, days = n.startsWith("Product") ? null : t / mill;
          return `<div style="display:grid;grid-template-columns:140px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f4f4f5">
            <div><div style="font-size:13px;font-weight:500">${n}</div><div class="ax-small" style="color:var(--ink-3)">${g} g/t</div></div>
            <div><div class="ax-bar" style="height:10px"><div style="width:${pct}%"></div></div><div class="ax-small" style="color:var(--ink-3);margin-top:3px">${F.compact(t)} of ${F.compact(cap)} t</div></div>
            <div style="text-align:right"><strong style="font-variant-numeric:tabular-nums">${days ? days.toFixed(1) + " days" : F.compact(t) + " t"}</strong><div class="ax-small" style="color:var(--ink-3)">${days ? "of mill feed" : "awaiting shipment"}</div></div></div>`;
        }).join("");
      }
    },
    {
      title: "Dust Compliance (PM10)",
      level: 3,
      desc: "Hourly PM10 with the 24-hour rolling average against the 50 µg/m³ licence limit. Shows exceedances and early warning.",
      render(b) {
        const n = 24 * 10, hourly = D.wave(n, { base: 32, amp: 14, noise: 12, seed: 66, phase: -8 }).map((v, i) => Math.max(4, v + (i > 170 && i < 200 ? 30 : 0)));
        const roll = hourly.map((_, i) => (i < 23 ? null : +(sum(hourly.slice(i - 23, i + 1)) / 24).toFixed(1)));
        const T = i => Date.now() - (n - 1 - i) * HOUR;
        const exc = roll.filter((v, i) => v > 50 && (roll[i - 1] || 0) <= 50).length;
        const last = roll[n - 1];
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">24 h average <strong>${last} µg/m³</strong></span><span class="ax-pill ax-pill--${last > 50 ? "bad" : last > 40 ? "warn" : "good"}">${last > 50 ? "Exceeding" : last > 40 ? "Approaching limit" : "Compliant"}</span><span class="ax-pill ax-pill--${exc ? "bad" : "good"}">${exc} exceedance event${exc === 1 ? "" : "s"} (10 days)</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "time" }, yAxis: { type: "value", name: "µg/m³" },
          series: [
            { type: "bar", name: "Hourly", data: hourly.map((v, i) => [T(i), +v.toFixed(1)]), itemStyle: { color: "#c7d2fe", borderRadius: 1 }, barCategoryGap: "10%" },
            { type: "line", name: "24 h rolling", data: roll.map((v, i) => [T(i), v]), lineStyle: { width: 2.5 },
              markLine: { symbol: "none", silent: true, label: { formatter: "Licence 50", position: "insideEndTop", fontSize: 10, color: "#ef4444" }, lineStyle: { color: "#ef4444", type: "dashed" }, data: [{ yAxis: 50 }] },
              markArea: { silent: true, itemStyle: { color: "rgba(239,68,68,.07)" }, data: [[{ yAxis: 50 }, { yAxis: 200 }]] } }
          ]
        }, 240);
      }
    },
    {
      title: "Wind and Dust Rose",
      level: 3,
      desc: "Where dust comes from: PM10 by wind direction and concentration band. Tells you which activity or boundary is the source.",
      render(b) {
        const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
        const bands = [["< 25", "#c7d2fe"], ["25 to 50", "#818cf8"], ["50 to 100", "#f59e0b"], ["> 100", "#ef4444"]];
        const r = D.rng(17), w = i => Math.exp(-((i - 11) ** 2) / 8) + 0.25;
        AX.chart(b, {
          legend: { bottom: 0, data: bands.map(x => x[0]) }, tooltip: { trigger: "item", formatter: p => `${p.name} wind<br>${p.seriesName} µg/m³: ${p.value}% of hours` },
          polar: { radius: [8, "70%"], center: ["50%", "46%"] }, angleAxis: { type: "category", data: dirs, startAngle: 101.25, axisLabel: { fontSize: 10, color: "#71717a" } },
          radiusAxis: { axisLabel: { show: false }, axisLine: { show: false }, splitLine: { lineStyle: { color: "#f0f0f2" } } },
          series: bands.map(([n, c], bi) => ({ type: "bar", name: n, coordinateSystem: "polar", stack: "r", itemStyle: { color: c },
            data: dirs.map((_, i) => +(w(i) * [3, 2, 0.9, 0.35][bi] * (0.6 + r() * 0.8)).toFixed(2)) }))
        }, 290);
      }
    },
    {
      title: "Blast Monitoring",
      level: 3,
      desc: "Each blast's ground vibration (PPV) and airblast overpressure against licence limits, with the 5% allowance tracked.",
      render(b) {
        const r = D.rng(23), blasts = Array.from({ length: 36 }, (_, i) => ({ id: `B-${2400 + i}`, ppv: +(0.6 + r() ** 1.8 * 6).toFixed(2), ob: +(98 + r() * 22).toFixed(1), t: Date.now() - (36 - i) * 2 * DAY }));
        const over = blasts.filter(x => x.ppv > 5 || x.ob > 115);
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small"><strong>${blasts.length}</strong> blasts this year</span><span class="ax-pill ax-pill--${over.length / blasts.length > 0.05 ? "bad" : "warn"}">${over.length} over limit (${(over.length / blasts.length * 100).toFixed(1)}%, allowance 5%)</span><span class="ax-small" style="color:var(--ink-3)">Limit: 10 mm/s and 120 dBL never</span></div>`;
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: p => `${p.data[2]} · ${F.date(p.data[3])}<br>PPV ${p.data[0]} mm/s<br>Overpressure ${p.data[1]} dBL` },
          xAxis: { type: "value", name: "PPV mm/s", min: 0, max: 8 }, yAxis: { type: "value", name: "dBL", min: 95, max: 125 },
          series: [{ type: "scatter", symbolSize: 10, data: blasts.map(x => ({ value: [x.ppv, x.ob, x.id, x.t], itemStyle: { color: x.ppv > 5 || x.ob > 115 ? "#ef4444" : "#4f46e5" } })),
            markArea: { silent: true, itemStyle: { color: "rgba(16,185,129,.06)" }, data: [[{ xAxis: 0, yAxis: 95 }, { xAxis: 5, yAxis: 115 }]] },
            markLine: { symbol: "none", silent: true, lineStyle: { color: "#f59e0b", type: "dashed" }, label: { fontSize: 10, formatter: "{b}" }, data: [{ name: "5 mm/s", xAxis: 5 }, { name: "115 dBL", yAxis: 115 }] } }]
        }, 250);
      }
    },
    {
      title: "Tailings Dam TARP",
      level: 3,
      wide: true,
      desc: "Piezometer pore pressures against Green, Amber and Red trigger levels. Pick an instrument to see its trend and the response the TARP requires.",
      render(b) {
        const inst = [
          { id: "VWP-01", loc: "Embankment crest, Ch 200", base: 38, t: [45, 55], seed: 1 }, { id: "VWP-04", loc: "Downstream toe, Ch 450", base: 44, t: [45, 55], seed: 4, rise: 0.06 },
          { id: "VWP-07", loc: "Decant tower", base: 29, t: [40, 50], seed: 7 }, { id: "VWP-09", loc: "Abutment, Ch 900", base: 49, t: [45, 55], seed: 9, rise: 0.03 }
        ];
        const act = ["Routine monitoring. Weekly readings.", "Increase readings to daily. Inspect embankment. Notify geotechnical engineer within 24 h.", "Stop deposition in affected cell. Engineer on site within 4 h. Notify regulator and dam safety committee."];
        const col = ["#10b981", "#f59e0b", "#ef4444"], name = ["Green", "Amber", "Red"];
        inst.forEach(x => { x.data = D.ts(90, DAY, D.walk(90, { base: x.base, vol: 0.8, seed: x.seed }).map((v, i) => +(v + (x.rise || 0) * i).toFixed(1))); x.v = x.data[89][1]; x.lvl = x.v >= x.t[1] ? 2 : x.v >= x.t[0] ? 1 : 0; });
        const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:260px 1fr;gap:16px"></div>`);
        const list = AX.add(wrap, `<div></div>`), right = AX.add(wrap, `<div></div>`);
        const info = AX.add(right, `<div></div>`);
        const c = AX.chart(right, { xAxis: { type: "time" }, yAxis: { type: "value", name: "kPa", scale: true }, series: [] }, 220);
        let sel = 1;
        const draw = () => {
          list.innerHTML = inst.map((x, i) => `<button type="button" data-i="${i}" style="all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;margin-bottom:4px;background:${i === sel ? "var(--accent-soft)" : "transparent"}">
            <span style="width:10px;height:10px;border-radius:50%;background:${col[x.lvl]};box-shadow:0 0 0 3px ${col[x.lvl]}26"></span>
            <span style="flex:1"><span style="font-size:13px;font-weight:600">${x.id}</span><br><span class="ax-small" style="color:var(--ink-3)">${x.loc}</span></span><strong class="ax-small">${x.v}</strong></button>`).join("");
          const x = inst[sel];
          info.innerHTML = `<div class="ax-row" style="gap:10px;margin-bottom:6px"><span class="ax-pill" style="background:${col[x.lvl]}1f;color:${col[x.lvl]}">${name[x.lvl]} TARP</span><span class="ax-small"><strong>${x.id}</strong> ${x.v} kPa · Amber at ${x.t[0]}, Red at ${x.t[1]}</span></div>
            <div class="ax-small" style="background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px"><strong>Required response:</strong> ${act[x.lvl]}</div>`;
          c.setOption({ series: [{ type: "line", name: x.id, data: x.data, lineStyle: { width: 2.2 },
            markArea: { silent: true, data: [[{ yAxis: x.t[0], itemStyle: { color: "rgba(245,158,11,.08)" } }, { yAxis: x.t[1] }], [{ yAxis: x.t[1], itemStyle: { color: "rgba(239,68,68,.08)" } }, { yAxis: 200 }]] },
            markLine: { symbol: "none", silent: true, label: { fontSize: 10, formatter: "{b}", position: "insideEndTop" }, data: [{ name: "Amber", yAxis: x.t[0], lineStyle: { color: "#f59e0b", type: "dashed" } }, { name: "Red", yAxis: x.t[1], lineStyle: { color: "#ef4444", type: "dashed" } }] } }],
            yAxis: { max: Math.max(x.t[1] + 4, Math.ceil(Math.max(...x.data.map(p => p[1])) + 2)) } });
        };
        list.addEventListener("click", e => { const btn = e.target.closest("[data-i]"); if (btn) { sel = +btn.dataset.i; draw(); } });
        draw();
      }
    }
  ]);
})();
</script>
<script>
/* ==========================================================================
 * Energy: 12 domain components, simple to advanced
 * ========================================================================== */
(() => {
  const HOUR = D.HOUR, DAY = D.DAY, HH = 30 * 60e3;
  const sum = a => a.reduce((s, v) => s + v, 0);
  const tile = (l, v, sub, tone = "") => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div class="ax-kpi__label">${l}</div><div style="font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums">${v}</div><div class="ax-small" style="color:${tone ? `var(--${tone})` : "var(--ink-3)"}">${sub}</div></div>`;
  const halfHours = Array.from({ length: 48 }, (_, i) => `${F.pad(Math.floor(i / 2))}:${i % 2 ? "30" : "00"}`);

  /* Commercial site demand profile in kW for one day (48 half-hours) */
  const dayProfile = (seed, scale = 1) => {
    const r = D.rng(seed);
    return halfHours.map((_, i) => {
      const h = i / 2, work = h >= 6 && h <= 19;
      return Math.round((380 + (work ? 520 * Math.sin(((h - 6) / 13) * Math.PI) ** 0.6 : 0) + r() * 60) * scale);
    });
  };
  const CONTRACT = 950;

  AX.section("energy", [
    {
      title: "Site Energy Summary",
      level: 1,
      desc: "Month-to-date consumption, cost, peak demand and emissions, each compared with the same period last year.",
      render(b) {
        b.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
          ${tile("Consumption", "412 MWh", "▼ 6.2% vs last year", "ok")}${tile("Energy cost", "$71,840", "▼ 3.9% vs last year", "ok")}
          ${tile("Peak demand", "924 kW", "97% of 950 kW contract", "warn")}${tile("Emissions", "278 tCO₂e", "Scope 2, location based")}</div>`;
      }
    },
    {
      title: "Interval Load Profile",
      level: 2,
      desc: "Half-hourly demand for a day with the contracted maximum demand and the peak interval marked.",
      render(b) {
        const days = { today: ["Today", 3], yday: ["Yesterday", 4], peak: ["Peak day (12 Oct)", 9] };
        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg(Object.entries(days).map(([k, v]) => [k, v[0]]), "today")}<span class="ax-small" data-p></span></div>`);
        const c = AX.chart(b, { xAxis: { type: "category", data: halfHours, axisLabel: { interval: 5 } }, yAxis: { type: "value", name: "kW" }, series: [] }, 240);
        const draw = k => {
          const p = dayProfile(days[k][1], k === "peak" ? 1.06 : 1), mx = Math.max(...p), at = p.indexOf(mx);
          ctl.querySelector("[data-p]").innerHTML = `Peak <strong>${mx} kW</strong> at ${halfHours[at]} · <span class="${mx > CONTRACT ? "ax-down" : "ax-up"}">${mx > CONTRACT ? "over" : "within"} contract</span>`;
          c.setOption({ series: [{ type: "line", name: "Demand", data: p, areaStyle: {}, step: "end",
            markPoint: { symbol: "circle", symbolSize: 9, itemStyle: { color: mx > CONTRACT ? "#ef4444" : "#4f46e5", borderColor: "#fff", borderWidth: 2 }, label: { show: false }, data: [{ coord: [at, mx] }] },
            markLine: { symbol: "none", silent: true, label: { formatter: `Contract ${CONTRACT} kW`, position: "insideEndTop", fontSize: 10, color: "#ef4444" }, lineStyle: { color: "#ef4444", type: "dashed" }, data: [{ yAxis: CONTRACT }] } }] });
        };
        draw("today");
        AX.onSeg(ctl.querySelector(".ax-seg"), draw);
      }
    },
    {
      title: "Load Duration Curve",
      level: 2,
      desc: "30 days of half-hourly demand sorted highest to lowest. Shows base load, and how few hours drive the peak you pay for.",
      render(b) {
        const all = Array.from({ length: 30 }, (_, d) => dayProfile(d + 20, d % 7 >= 5 ? 0.7 : 1)).flat().sort((a, z) => z - a);
        const n = all.length, top = all[0], p1 = all[Math.floor(n * 0.01)], base = all[Math.floor(n * 0.9)];
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">Peak <strong>${top} kW</strong></span><span class="ax-small">Top 1% of time above <strong>${p1} kW</strong></span><span class="ax-small">Base load <strong>${base} kW</strong></span>
          <span class="ax-pill ax-pill--info">Shaving the top 1% saves ${top - p1} kW of demand</span></div>`;
        AX.chart(b, {
          tooltip: { trigger: "axis", formatter: p => `${p[0].data[0].toFixed(1)}% of time above ${p[0].data[1]} kW` },
          xAxis: { type: "value", max: 100, name: "% of time", axisLabel: { formatter: "{value}%" } }, yAxis: { type: "value", name: "kW", min: 0 },
          series: [{ type: "line", data: all.map((v, i) => [+(i / n * 100).toFixed(2), v]), areaStyle: {}, sampling: "lttb",
            markArea: { silent: true, itemStyle: { color: "rgba(239,68,68,.08)" }, label: { color: "#ef4444", fontSize: 10 }, data: [[{ name: "Peak", xAxis: 0 }, { xAxis: 1 }]] },
            markLine: { symbol: "none", silent: true, label: { formatter: "Base {c} kW", fontSize: 10, position: "insideEndTop" }, lineStyle: { color: "#a1a1aa", type: "dashed" }, data: [{ yAxis: base }] } }]
        }, 230);
      }
    },
    {
      title: "Time-of-Use Breakdown",
      level: 2,
      desc: "Daily consumption split into peak, shoulder and off-peak tariff periods. Switch between energy and cost.",
      render(b) {
        const tariffs = [["Peak", 0.28, "#4f46e5"], ["Shoulder", 0.17, "#a5b4fc"], ["Off-peak", 0.09, "#d4d4d8"]];
        const r = D.rng(31), days = Array.from({ length: 14 }, (_, i) => F.date(Date.now() - (13 - i) * DAY));
        const kwh = days.map((_, i) => { const we = (i + 3) % 7 >= 5; return [we ? 1800 : 7200 + r() * 900, we ? 2600 : 4800 + r() * 500, 3900 + r() * 400].map(Math.round); });
        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg([["kwh", "kWh"], ["cost", "Cost $"]], "kwh")}<span class="ax-small" data-t></span></div>`);
        const c = AX.chart(b, { legend: { top: 0 }, xAxis: { type: "category", data: days, axisLabel: { interval: 1 } }, yAxis: { type: "value" }, series: [] }, 230);
        const draw = m => {
          const val = (d, ti) => (m === "kwh" ? d[ti] : Math.round(d[ti] * tariffs[ti][1]));
          const total = sum(kwh.map(d => sum(d.map((_, ti) => d[ti] * tariffs[ti][1]))));
          ctl.querySelector("[data-t]").innerHTML = `14-day cost <strong>$${F.num(total)}</strong> · peak share ${Math.round(sum(kwh.map(d => d[0] * tariffs[0][1])) / total * 100)}% of cost`;
          c.setOption({ yAxis: { name: m === "kwh" ? "kWh" : "$" }, series: tariffs.map(([n, , col], ti) => ({ type: "bar", name: n, stack: "t", data: kwh.map(d => val(d, ti)), itemStyle: { color: col, borderRadius: ti === 2 ? [3, 3, 0, 0] : 0 } })) }, { replaceMerge: ["series"] });
        };
        draw("kwh");
        AX.onSeg(ctl.querySelector(".ax-seg"), draw);
      }
    },
    {
      title: "Generation vs Consumption",
      level: 2,
      desc: "Solar generation against site load, with net grid import above zero and export below. Shows self-consumption at a glance.",
      render(b) {
        const load = dayProfile(5, 0.6), solar = halfHours.map((_, i) => { const h = i / 2; return h > 6 && h < 18.5 ? Math.round(620 * Math.sin(((h - 6) / 12.5) * Math.PI) ** 1.3) : 0; });
        const net = load.map((v, i) => v - solar[i]);
        const selfUse = sum(load.map((v, i) => Math.min(v, solar[i]))) / sum(solar) * 100;
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">Solar ${F.num(sum(solar) / 2)} kWh · Exported ${F.num(sum(net.filter(v => v < 0)) / -2)} kWh</span><span class="ax-pill ax-pill--good">${selfUse.toFixed(0)}% self-consumed</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: halfHours, axisLabel: { interval: 5 } }, yAxis: { type: "value", name: "kW" },
          series: [
            { type: "bar", name: "Net grid", data: net.map(v => ({ value: v, itemStyle: { color: v < 0 ? "#10b981" : "#e4e4e7", borderRadius: v < 0 ? [0, 0, 2, 2] : [2, 2, 0, 0] } })), barCategoryGap: "20%" },
            { type: "line", name: "Solar", data: solar, areaStyle: {}, color: "#0d9488" },
            { type: "line", name: "Site load", data: load }
          ]
        }, 240);
      }
    },
    {
      title: "Battery State of Charge",
      level: 2,
      desc: "Battery charge level across the day with charging and discharging power, so you can see it soaking up solar and shaving the evening peak.",
      render(b) {
        let soc = 34;
        const power = halfHours.map((_, i) => { const h = i / 2; return h >= 9 && h < 14 ? -220 : h >= 17 && h < 21 ? 240 : h >= 1 && h < 4 ? -60 : 0; });
        const socs = power.map(p => (soc = Math.max(8, Math.min(98, soc - p / 2 / 500 * 100)), +soc.toFixed(1)));
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small">500 kWh / 250 kW battery · now <strong>${socs[29]}%</strong></span><span class="ax-pill ax-pill--good">2 cycles today</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: halfHours, axisLabel: { interval: 5 } },
          yAxis: [{ type: "value", name: "kW (+ discharge)" }, { type: "value", name: "SoC %", max: 100, splitLine: { show: false } }],
          series: [
            { type: "bar", name: "Charge / discharge", data: power.map(v => ({ value: v, itemStyle: { color: v > 0 ? "#4f46e5" : "#a5b4fc" } })), barCategoryGap: "20%" },
            { type: "line", name: "State of charge", yAxisIndex: 1, data: socs, color: "#0d9488", lineStyle: { width: 2.5 } }
          ]
        }, 240);
      }
    },
    {
      title: "Power Factor and kVA",
      level: 2,
      desc: "Power factor against the 0.95 target. Low power factor raises kVA demand, which many network tariffs charge for.",
      render(b) {
        const n = 7 * 48, pf = D.walk(n, { base: 0.93, vol: 0.012, min: 0.8, max: 0.995, seed: 81 });
        const T = i => Date.now() - (n - 1 - i) * HH, below = pf.filter(v => v < 0.95).length / n * 100;
        const kw = 900, kva = Math.round(kw / Math.min(...pf.slice(-48)));
        b.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">${tile("Average PF", (sum(pf) / n).toFixed(3), `${below.toFixed(0)}% of intervals below 0.95`, below > 30 ? "warn" : "")}${tile("Peak kVA", F.num(kva), `vs ${kw} kW real power`)}${tile("Correction value", "$" + F.num((kva - kw / 0.98) * 14.2 * 12), "Per year at $14.20/kVA/month", "ok")}</div>`;
        AX.chart(b, {
          xAxis: { type: "time" }, yAxis: { type: "value", min: 0.8, max: 1 },
          series: [{ type: "line", name: "Power factor", data: pf.map((v, i) => [T(i), v]), sampling: "lttb",
            markArea: { silent: true, itemStyle: { color: "rgba(16,185,129,.07)" }, data: [[{ yAxis: 0.95 }, { yAxis: 1 }]] },

        };
        svg.addEventListener("click", async e => {

})();

          svg.querySelector('[data-wtp="flow"]').textContent = `Inflow ${qA} L/s`;
          svg.querySelector("[data-out]").textContent = `${out} L/s to town`;
          setLevel("dam", S.dam); setLevel("tank", S.tank); setLevel("res", S.res);
          const alarms = [S.faultP3 && "P3 tripped on low clear water level", S.tank > 95 && "Clear water tank high level", S.res < 25 && "Town reservoir low"].filter(Boolean);
          b.querySelector("[data-k]").innerHTML = `<span class="ax-pill ax-pill--${alarms.length ? "bad" : "live"}">${alarms.length ? alarms.length + " active alarm" + (alarms.length > 1 ? "s" : "") : "Running normally"}</span>${alarms.map(a => `<span class="ax-small" style="color:var(--bad)">${a}</span>`).join("")}<span class="ax-small" style="color:var(--ink-3);margin-left:auto">Production ${qA} L/s · Transfer ${qB} L/s · Demand ${out} L/s</span>`;
        };
        svg.addEventListener("click", async e => {
          const p = e.target.closest("[data-pump]"), v = e.target.closest("[data-valve]");
          if (p) {
            const id = p.dataset.pump, on = S[id] && !(id === "P3" && S.faultP3);
            if (!await AX.modal({ title: `${on ? "Stop" : "Start"} pump ${id}?`, body: `${id === "P3" ? "High-lift transfer pump to the town reservoir." : "Raw water intake pump."}${id === "P3" && S.faultP3 ? " This also resets the low-level trip." : ""}`, confirm: on ? "Stop pump" : "Start pump" })) return;
            if (id === "P3" && S.faultP3) { S.faultP3 = false; S.P3 = true; } else S[id] = !on;
            AX.rv("pushPayload", { pump: id, command: S[id] ? "start" : "stop" }, 205813, "UID", "WTP-01", Date.now());
          }
          if (v) {
            if (!await AX.modal({ title: `${S.V1 ? "Close" : "Open"} valve V1?`, body: S.V1 ? "Closing V1 stops all flow from the treatment plant to the clear water tank." : "Restores flow to the clear water tank.", confirm: S.V1 ? "Close valve" : "Open valve" })) return;
            S.V1 = !S.V1;
            AX.rv("pushPayload", { valve: "V1", command: S.V1 ? "open" : "close" }, 205813, "UID", "WTP-01", Date.now());
          }
          draw();
        });
        AX.every(1000, () => {
          const { qA, qB, out } = flows();
          S.dam = Math.max(0, S.dam - qA * 0.00002);
          S.tank = Math.max(0, Math.min(100, S.tank + (qA - qB) * 0.012));
          S.res = Math.max(0, Math.min(100, S.res + (qB - out) * 0.008));
          if (S.tank < 10 && S.P3 && !S.faultP3) { S.faultP3 = true; AX.toast("P3 tripped: clear water tank low level interlock", "bad"); }
          draw();
        }, b);
        draw();
      }
    }
  ]);
})();

<script>
/* ==========================================================================

(() => {

  /* Condition scale 1 (very good) to 5 (very poor) */

  const classes = ["Pumps", "Valves", "Pipes", "Motors", "Switchboards", "Tanks"];

  /* Synthetic asset register */
  const assets = Array.from({ length: 80 }, (_, i) => {

      crit: Math.min(5, Math.max(1, Math.round(1 + r() * 4.2))), like: Math.min(5, Math.max(1, Math.round(cond - 0.5 + r() * 1.6))),
      health: Math.round(100 - cond * 15 - r() * 12), rul: +(Math.max(0.3, (6 - cond) * 3.2 + (r() - 0.5) * 5)).toFixed(1),
      value: Math.round((cls === "Pipes" ? 400 : cls === "Switchboards" ? 260 : 60 + r() * 140) * 1000)
    };
  });

  AX.section("assets", [
    {
      title: "Asset Portfolio Summary",
      level: 1,
      desc: "The register at a glance: asset count, replacement value, average condition and the share in poor or very poor condition.",
      render(b) {
        const poor = assets.filter(a => a.cond >= 4).length;
        b.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
          ${tile("Assets", F.num(assets.length * 54), "Across 8 sites, 6 classes")}${tile("Replacement value", "$" + F.compact(sum(assets.map(a => a.value)) * 54), "Current, gross")}
          ${tile("Average condition", (sum(assets.map(a => a.cond)) / assets.length).toFixed(1) + " / 5", "1 very good, 5 very poor")}${tile("Poor or very poor", Math.round(poor / assets.length * 100) + "%", `${poor * 54} assets need attention`, "warn")}</div>`;

    },
    {
      title: "Condition by Asset Class",
      level: 1,

        }, 260);

    },
    {
      title: "Risk Matrix",
      level: 2,

        const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center"></div>`);
        wrap.innerHTML = `<div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;color:var(--ink-3);text-align:center">Likelihood →</div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">${[5, 4, 3, 2, 1].map(l => [1, 2, 3, 4, 5].map(c => {
            const n = assets.filter(a => a.like === l && a.crit === c).length, [, col] = band(score(l, c));
            return `<button type="button" data-l="${l}" data-c="${c}" style="all:unset;cursor:pointer;aspect-ratio:1.6;border-radius:7px;display:grid;place-items:center;background:${col}${n ? "2e" : "12"};color:${col};font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px ${col}33">${n || ""}</button>`;
          }).join("")).join("")}</div>
          <div></div><div class="ax-small" style="text-align:center;color:var(--ink-3)">Consequence →</div>`;

          out.innerHTML = `<strong style="color:var(--ink)">${bn} risk</strong> · likelihood ${l} × consequence ${c} · ${list.length} asset${list.length === 1 ? "" : "s"}<br>${list.slice(0, 10).map(a => `<span class="ax-pill" style="margin:4px 4px 0 0">${a.id}</span>`).join("") || "None"}`;

    {

      render(b) {
        AX.chart(b, {
          tooltip: { trigger: "item", formatter: p => `${p.data[2]} (${p.data[3]})<br>Health ${p.data[0]} · Criticality ${p.data[1]}` },
          grid: { left: 4, right: 12, top: 14, bottom: 26, containLabel: true },
          xAxis: { type: "value", name: "Health score (lower is worse)", nameLocation: "middle", nameGap: 26, min: 0, max: 100, inverse: true }, yAxis: { type: "value", name: "Criticality", min: 0, max: 5.5 },
          series: [{ type: "scatter", symbolSize: 9, data: assets.map(a => { const cr = +(a.crit + (D.rng(a.health)() - 0.5) * 0.6).toFixed(2); return { value: [a.health, cr, a.id, a.cls], itemStyle: { color: a.health < 50 && cr >= 3 ? "#ef4444" : a.health < 50 || cr >= 3 ? "#4f46e5" : "#a1a1aa" } }; }),
            markLine: { symbol: "none", silent: true, label: { show: false }, lineStyle: { color: "#d4d4d8" }, data: [{ xAxis: 50 }, { yAxis: 3 }] },
            markArea: { silent: true, label: { fontSize: 11, fontWeight: 600, position: "insideTopRight" }, data: [
              [{ name: "Act now", xAxis: 50, yAxis: 5.5, itemStyle: { color: "rgba(239,68,68,.06)" }, label: { color: "#ef4444", position: "insideTopRight" } }, { xAxis: 0, yAxis: 3 }],
              [{ name: "Plan renewal", xAxis: 50, yAxis: 3, itemStyle: { color: "rgba(0,0,0,0)" }, label: { color: "#71717a", position: "insideBottomRight" } }, { xAxis: 0, yAxis: 0 }],
              [{ name: "Maintain and monitor", xAxis: 100, yAxis: 5.5, itemStyle: { color: "rgba(0,0,0,0)" }, label: { color: "#71717a", position: "insideTopLeft" } }, { xAxis: 50, yAxis: 3 }],
              [{ name: "Run to failure", xAxis: 100, yAxis: 3, itemStyle: { color: "rgba(0,0,0,0)" }, label: { color: "#a1a1aa", position: "insideBottomLeft" } }, { xAxis: 50, yAxis: 0 }]] } }]
        }, 290);
      }
    },
    {
      title: "Remaining Useful Life",
      level: 2,
      desc: "Assets with the least remaining life first, with the year each will need replacing. Feeds directly into the renewal plan.",
      render(b) {
        const list = [...assets].sort((a, z) => a.rul - z.rul).slice(0, 12), yr = new Date().getFullYear();
        AX.chart(b, {
          tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, formatter: p => `${p[0].name}<br>${p[0].value} years · replace ${yr + Math.floor(p[0].value)}` },
          xAxis: { type: "value", name: "Years" }, yAxis: { type: "category", data: list.map(a => `${a.id} ${a.cls}`), inverse: true, axisLabel: { fontSize: 10.5 } },
          series: [{ type: "bar", barMaxWidth: 12, data: list.map(a => ({ value: a.rul, itemStyle: { color: a.rul < 2 ? "#ef4444" : a.rul < 5 ? "#f59e0b" : "#4f46e5", borderRadius: [0, 3, 3, 0] } })),
            label: { show: true, position: "right", fontSize: 10, color: "#71717a", formatter: p => `${yr + Math.floor(p.value)}` } }]
        }, 300);
      }
    },
    {
      title: "Maintenance Performance",
      level: 2,
      desc: "The core maintenance KPIs: PM compliance, planned vs reactive work, MTBF, MTTR and backlog in crew-weeks.",
      render(b) {
        b.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:center"><div data-d></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${tile("PM compliance", "87%", "Target 90%", "warn")}${tile("MTBF", "412 h", "▲ 8% vs last quarter", "ok")}${tile("MTTR", "5.6 h", "▼ 0.4 h vs last quarter", "ok")}${tile("Backlog", "3.4 wk", "Healthy range 2 to 4")}</div></div>`;
        AX.chart(b.querySelector("[data-d]"), {
          tooltip: { trigger: "item", formatter: "{b}: {d}%" },
          graphic: [{ type: "text", left: "center", top: "40%", style: { text: "71%", fontSize: 24, fontWeight: 600, fill: "#18181b", textAlign: "center" } }, { type: "text", left: "center", top: "56%", style: { text: "planned", fontSize: 11, fill: "#a1a1aa", textAlign: "center" } }],
          series: [{ type: "pie", radius: ["58%", "80%"], label: { show: false }, data: [{ name: "Planned", value: 71, itemStyle: { color: "#4f46e5" } }, { name: "Reactive", value: 29, itemStyle: { color: "#f59e0b" } }] }]
        }, 170);
      }
    },
    {
      title: "Work Order Backlog Ageing",
      level: 2,
      desc: "Open work orders by age and priority. Old high-priority work is the risk; old low-priority work is a clean-up job.",
      render(b) {
        const buckets = ["0 to 7 days", "8 to 30 days", "31 to 90 days", "Over 90 days"];
        const pri = [["Priority 1", [6, 2, 1, 0], "#ef4444"], ["Priority 2", [18, 14, 6, 2], "#f59e0b"], ["Priority 3", [34, 41, 28, 19], "#4f46e5"], ["Priority 4", [22, 30, 37, 44], "#c7d2fe"]];
        b.innerHTML = `<div class="ax-ctl"><span class="ax-small"><strong>${sum(pri.flatMap(p => p[1]))}</strong> open work orders</span><span class="ax-pill ax-pill--bad">3 priority 1 orders past 7-day target</span></div>`;
        AX.chart(b, {
          legend: { top: 0 }, xAxis: { type: "category", data: buckets }, yAxis: { type: "value", name: "Work orders" },
          series: pri.map(([n, d, c], i) => ({ type: "bar", name: n, stack: "p", data: d, itemStyle: { color: c, borderRadius: i === 3 ? [3, 3, 0, 0] : 0 }, barMaxWidth: 44 }))
        }, 240);
      }
    },
    {
      title: "Renewal Forecast",
      level: 2,
      desc: "Ten-year capital renewal need by asset class against expected funding, showing the size and timing of the funding gap.",
      render(b) {
        const yr = new Date().getFullYear(), years = Array.from({ length: 10 }, (_, i) => String(yr + 1 + i));
        const need = classes.map((c, ci) => years.map((_, i) => Math.round((0.6 + ci * 0.15) * (1 + 0.6 * Math.sin((i + ci) / 2) ** 2) * 1000) / 1000));
        const totals = years.map((_, i) => sum(need.map(n => n[i]))), funding = years.map(() => 6.2);
        const gap = sum(totals.map((t, i) => Math.max(0, t - funding[i])));

        AX.chart(b, {
          legend: { top: 0, type: "scroll" }, tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: v => "$" + (+v).toFixed(2) + "M" },
          xAxis: { type: "category", data: years }, yAxis: { type: "value", axisLabel: { formatter: v => "$" + v + "M" } },
          series: [...classes.map((c, ci) => ({ type: "bar", name: c, stack: "n", data: need[ci], itemStyle: { color: AX.PALETTE[ci], borderRadius: 0 }, barMaxWidth: 34 })),
            { type: "line", name: "Funding", data: funding, step: "middle", color: "#18181b", lineStyle: { type: "dashed", width: 2 } }]

      }
    },
    {
      title: "Vibration Trend (ISO 10816)",
      level: 3,
      desc: "Overall vibration velocity against ISO 10816 zones A to D, with a projection of when the asset will reach the alarm zone.",
      render(b) {
        const machines = { "P-101 pump": [1.6, 0.004, 1], "FAN-02 fan": [2.4, 0.016, 2], "CMP-03 compressor": [3.2, 0.022, 3] };
        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg(Object.keys(machines).map(k => [k, k]), "FAN-02 fan")}<span class="ax-small" data-p></span></div>`);
        const zones = [[0, 1.4, "A Good", "rgba(16,185,129,.07)"], [1.4, 2.8, "B Acceptable", "rgba(16,185,129,.03)"], [2.8, 7.1, "C Alarm", "rgba(245,158,11,.08)"], [7.1, 12, "D Danger", "rgba(239,68,68,.08)"]];
        const c = AX.chart(b, { xAxis: { type: "time" }, yAxis: { type: "value", name: "mm/s RMS", min: 0, max: 9 }, series: [] }, 250);

          ctl.querySelector("[data-p]").innerHTML = last >= 2.8 ? '<span class="ax-pill ax-pill--warn">In alarm zone C</span>' : daysTo < 120 ? `<span class="ax-pill ax-pill--warn">Reaches zone C in ~${Math.round(daysTo)} days</span>` : '<span class="ax-pill ax-pill--good">Stable</span>';

    },
    {
      title: "Vibration Spectrum (FFT)",
      level: 3,

      render(b) {
        const rpm = 1480, f1 = rpm / 60, bpfo = f1 * 3.58;
        const faults = {
          healthy: ["Healthy", "Low, even spectrum. 1× dominant at low amplitude.", { 1: 0.8 }],
          imbalance: ["Imbalance", "High 1× radial, little at harmonics. Balance the rotor.", { 1: 4.2, 2: 0.5 }],
          misalign: ["Misalignment", "Strong 2× (and 3×) relative to 1×. Check coupling alignment.", { 1: 1.6, 2: 3.1, 3: 1.4 }],

        const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg(Object.entries(faults).map(([k, v]) => [k, v[0]]), "misalign")}</div>`);

      }
    },
    {
      title: "Replace or Maintain",
      level: 3,
      desc: "Cumulative cost of keeping an ageing asset against replacing it now. Adjust the assumptions and the optimal replacement year moves.",
      render(b) {
        const ctl = AX.add(b, `<div class="ax-ctl">
          <label>Replacement cost $k <input type="range" min="80" max="300" value="160" data-k="cap" aria-label="Replacement cost"></label><strong data-v="cap"></strong>

        const out = AX.add(b, `<div class="ax-small" style="margin-bottom:6px"></div>`);
        const yr = new Date().getFullYear(), years = Array.from({ length: 15 }, (_, i) => String(yr + i));
        const c = AX.chart(b, { legend: { top: 0 }, xAxis: { type: "category", data: years }, yAxis: { type: "value", name: "$k cumulative" }, series: [] }, 240);
        const draw = () => {

          c.setOption({ series: [
            { type: "line", name: "Keep maintaining", data: keep, color: "#f59e0b", lineStyle: { width: 2.5 } },
            { type: "line", name: "Replace now", data: repl, lineStyle: { width: 2.5 },

          ] }, { replaceMerge: ["series"] });
        };
