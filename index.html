    // its final size. Stops maps opening off-centre; never overrides the user's own panning.
    let lastView = null, userMoved = false;
    ["setView", "fitBounds"].forEach(name => {
      const orig = m[name].bind(m);
      m[name] = (...args) => { if (!userMoved) lastView = [orig, args]; return orig(...args); };
    });
    box.addEventListener("pointerdown", () => { userMoved = true; });
    box.addEventListener("wheel", () => { userMoved = true; }, { passive: true });

    if (center) m.setView(center, zoom);
    else m.fitBounds(D.sites.map(s => [s.lat, s.lng]), { padding: [28, 28] });
    if (base) tiles(base).addTo(m);

    // Skip while hidden (other section showing): layers like the heatmap fail on a 0-width canvas
    new ResizeObserver(() => {
      if (!box.offsetWidth) return;
      m.invalidateSize();
      if (!userMoved && lastView) lastView[0](...lastView[1]);
    }).observe(box);
    return m;
  }

  function dot(color, size = 14) {
    return L.divIcon({
      className: "",
      html: `<span class="ax-mk" style="--c:${color};width:${size}px;height:${size}px"></span>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  /* Run `fn` every `ms`, but only while `node` is on screen. */
  function every(ms, fn, node) {
    const id = setInterval(() => {
      if (!node.isConnected) return clearInterval(id);
      if (document.hidden || node.offsetParent === null) return;
      fn();
    }, ms);
    return id;
  }

  function toast(msg, type = "") {
    const box = document.getElementById("ax-toasts");
    const t = add(box, `<div class="ax-toast ${type ? "ax-toast--" + type : ""}">${icon(type === "bad" ? "alert" : type === "good" ? "check" : "bell")}<span></span></div>`);
    t.querySelector("span").textContent = msg;
    setTimeout(() => { t.style.transition = "opacity .2s"; t.style.opacity = 0; setTimeout(() => t.remove(), 200); }, 3600);
  }

  function modal({ title, body, confirm = "Confirm", cancel = "Cancel" }) {
    return new Promise(resolve => {
      const bg = add(document.body, `
        <div class="ax-modal-backdrop" role="dialog" aria-modal="true">
          <div class="ax-modal">
            <div class="ax-modal__b">
              <h4>${F.esc(title)}</h4>
              <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${body}</div>
            </div>
            <div class="ax-modal__f">
              ${cancel ? `<button class="ax-btn" data-v="0">${cancel}</button>` : ""}
              <button class="ax-btn ax-btn--primary" data-v="1">${confirm}</button>
            </div>
          </div>
        </div>`);
      const close = v => { document.removeEventListener("keydown", onKey); bg.remove(); resolve(v); };
      const onKey = e => { if (e.key === "Escape") close(false); };
      document.addEventListener("keydown", onKey);
      bg.addEventListener("click", e => {
        if (e.target === bg) close(false);
        if (e.target.dataset.v) close(e.target.dataset.v === "1");
      });
      bg.querySelector(".ax-btn--primary").focus();
    });
  }

  /* Call a Rayven helper function, or show what would be called in demo mode. */
  function rv(name, ...args) {
    if (!AX_DEMO && typeof window[name] === "function") return window[name](...args);
    const shown = args.map(a => (typeof a === "string" ? `"${a}"` : JSON.stringify(a))).join(", ");
    toast(`Demo: ${name}(${shown.length > 180 ? shown.slice(0, 180) + "..." : shown})`);
  }

  function download(filename, text, type = "text/csv") {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = add(document.body, `<a href="${url}" download="${filename}" hidden></a>`);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function csv(rows, cols) {
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    return [cols.map(c => cell(c.label || c.key)).join(",")]
      .concat(rows.map(r => cols.map(c => cell(r[c.key])).join(",")))
      .join("\n");
  }

  function seg(options, active, cls = "") {
    return `<div class="ax-seg ${cls}">${options.map(([v, label]) =>
      `<button type="button" data-v="${v}" class="${String(v) === String(active) ? "is-active" : ""}">${label}</button>`).join("")}</div>`;
  }

  /* Wire a .ax-seg group; calls fn(value) and maintains active state. */
  function onSeg(root, fn) {
    root.addEventListener("click", e => {
      const b = e.target.closest("button[data-v]");
      if (!b) return;
      root.querySelectorAll("button").forEach(x => x.classList.toggle("is-active", x === b));
      fn(b.dataset.v);
    });
  }

  function pill(status) {
    return `<span class="ax-pill ax-pill--${String(status).toLowerCase()}">${status}</span>`;
  }

  /* ---------- Registry + gallery ---------- */
  function section(id, examples) {
    registry[id] = examples;
  }

  /* Append components to an existing section, then keep the simple-to-advanced order */
  function extend(id, examples) {
    registry[id] = (registry[id] || []).concat(examples).map((ex, i) => [ex, i])
      .sort((a, b) => a[0].level - b[0].level || a[1] - b[1]).map(x => x[0]);
  }

  function buildCard(ex, i) {
    const card = el(`
      <article class="ax-ex${ex.wide ? " ax-ex--wide" : ""}" data-level="${ex.level}">
        <header class="ax-ex__head">
          <span class="ax-ex__num">${i + 1}</span>
          <div class="ax-ex__titles">
            <h3>${ex.title}</h3>
            <p class="ax-ex__desc">${ex.desc}</p>
          </div>
          <span class="ax-lvl ax-lvl--${ex.level}" title="Complexity: ${LEVELS[ex.level]}"><span class="ax-lvl__bars"><i></i><i></i><i></i></span>${LEVELS[ex.level]}</span>
        </header>
        <div class="ax-ex__body"></div>
      </article>`);
    card._ex = ex;
    card._search = `${ex.title} ${ex.desc} ${LEVELS[ex.level]}`.toLowerCase();
    return card;
  }

  function renderCard(card) {
    if (card._rendered) return;
    card._rendered = true;
    const body = card.querySelector(".ax-ex__body");
    body.classList.add("is-in");
    try {
      card._ex.render(body);
    } catch (err) {
      console.error(card._ex.title, err);
      body.innerHTML = `<div class="ax-empty">This example failed to render: ${F.esc(err.message)}</div>`;
    }
  }

  /* Level filter with live counts for the current section and search */
  function renderLevels() {
    const list = (registry[state.section] || []).filter(ex => !state.query || `${ex.title} ${ex.desc} ${LEVELS[ex.level]}`.toLowerCase().includes(state.query));
    const count = l => list.filter(ex => !l || ex.level === l).length;
    document.getElementById("ax-level").innerHTML = [[0, "All"], [1, "Simple"], [2, "Intermediate"], [3, "Advanced"]]
      .map(([v, label]) => `<button type="button" data-v="${v}" class="${v === state.level ? "is-active" : ""}">${label}<span class="n">${count(v)}</span></button>`).join("");
  }

  function applyFilter() {
    const sec = document.querySelector(`.ax-section[data-section="${state.section}"]`);
    if (!sec) return;
    let shown = 0;
    sec.querySelectorAll(".ax-ex").forEach(card => {
      const ok = (!state.level || card._ex.level === state.level) && (!state.query || card._search.includes(state.query));
      card.hidden = !ok;
      if (ok) shown++;
    });
    sec.querySelector(".ax-empty").hidden = shown > 0;
    renderLevels();
  }

  function show(id) {
    const meta = SECTIONS.find(s => s.id === id) || SECTIONS[0];
    state.section = meta.id;

    document.querySelectorAll(".ax-nav__item").forEach(b => {
      const on = b.dataset.target === meta.id;
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-current", on ? "page" : "false");
    });
    document.querySelectorAll(".ax-section").forEach(s => s.classList.toggle("is-active", s.dataset.section === meta.id));
    document.getElementById("ax-title").textContent = meta.label;
    document.getElementById("ax-subtitle").textContent = meta.subtitle;
    document.getElementById("ax-crumb").textContent = meta.label;
    document.getElementById("ax-search").placeholder = `Search ${meta.label.toLowerCase()}`;
    document.getElementById("ax-main").scrollTop = 0;
    applyFilter();

    if (typeof setHTMLNodeGData === "function") setHTMLNodeGData("axSection", meta.id);
  }

  function start() {
    registerTheme();
    // Brand-consistent default marker in place of Leaflet's stock blue pin
    if (typeof L !== "undefined") L.Marker.prototype.options.icon = dot("#4f46e5", 16);

    const nav = document.getElementById("ax-nav");
    const host = document.getElementById("ax-sections");
    observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { renderCard(e.target); observer.unobserve(e.target); } });
    }, { root: document.getElementById("ax-main"), rootMargin: "300px 0px" });

    let group = "Components";
    SECTIONS.forEach(meta => {
      const examples = registry[meta.id] || [];
      if ((meta.group || "Components") !== group) {
        group = meta.group;
        add(nav, `<div class="ax-nav-sec">${group}</div>`);
      }
      const btn = add(nav, `
        <button type="button" class="ax-nav__item" data-target="${meta.id}">
          ${icon(meta.icon)}
          <span>${meta.label}</span>
          <span class="ax-nav__count">${examples.length}</span>
        </button>`);
      btn.addEventListener("click", () => show(meta.id));

      const sec = add(host, `<section class="ax-section" data-section="${meta.id}"><div class="ax-gallery"></div><div class="ax-empty" hidden>No components match your filters.</div></section>`);
      const gallery = sec.querySelector(".ax-gallery");
      examples.forEach((ex, i) => {
        const card = buildCard(ex, i);
        gallery.appendChild(card);
        observer.observe(card);
      });
    });

    const total = SECTIONS.reduce((a, s) => a + (registry[s.id] || []).length, 0);
    document.getElementById("ax-total").textContent = `${total} components across ${SECTIONS.length} categories`;

    onSeg(document.getElementById("ax-level"), v => { state.level = +v; applyFilter(); });
    const search = document.getElementById("ax-search");
    search.addEventListener("input", () => { state.query = search.value.trim().toLowerCase(); applyFilter(); });
    search.addEventListener("keydown", e => { if (e.key === "Escape") { search.value = ""; search.dispatchEvent(new Event("input")); search.blur(); } });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); search.focus(); }
    });

    const saved = typeof getHTMLNodeGData === "function" ? getHTMLNodeGData("axSection") : null;
    show(saved || SECTIONS[0].id);
  }

  return {
    PALETTE, STATUS_COLOR, section, extend, start, el, add, chart, map, tiles, dot, every,
    toast, modal, rv, download, csv, seg, onSeg, pill, icon, fade, renderCard
  };
})();
</script>
<script>
/* ==========================================================================
 * Assorted Widgets: 20 examples, simple to advanced
 * ========================================================================== */
AX.section("widgets", [
  {
    title: "Single Value",
    level: 1,
    desc: "One number with a label and unit. The most basic widget: show the latest value of one metric.",
    render(b) {
      b.innerHTML = `
        <div class="ax-kpi__label">Energy used today</div>
        <div class="ax-kpi__value">1,284<span class="ax-kpi__unit">kWh</span></div>
        <div class="ax-small ax-muted" style="margin-top:6px">Updated ${F.time(Date.now())}</div>`;
    }
  },
  {
    title: "Value with Change",
    level: 1,
    desc: "Current value compared with the previous period, with a coloured up or down arrow.",
    render(b) {
      const items = [["Avg temperature", "22.4", "°C", 1.8], ["Water usage", "8,910", "L", -6.4]];
      b.innerHTML = `<div class="ax-row" style="gap:28px;flex-wrap:wrap">${items.map(([l, v, u, d]) => `
        <div>
          <div class="ax-kpi__label">${l}</div>
          <div class="ax-kpi__value">${v}<span class="ax-kpi__unit">${u}</span></div>
          <div class="ax-small"><span class="${d >= 0 ? "ax-up" : "ax-down"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(d)}%</span> <span class="ax-muted">vs yesterday</span></div>
        </div>`).join("")}</div>`;
    }
  },
  {
    title: "Value with Sparkline",
    level: 1,
    desc: "A headline number with a small trend line underneath for context on recent movement.",
    render(b) {
      const data = D.walk(48, { base: 340, vol: 14, seed: 11 });
      b.innerHTML = `
        <div class="ax-kpi__label">Throughput (units/h)</div>
        <div class="ax-kpi__value">${F.num(data[data.length - 1])}</div>`;
      AX.chart(b, {
        grid: { left: 0, right: 0, top: 8, bottom: 0 },
        xAxis: { type: "category", show: false, data: data.map((_, i) => i) },
        yAxis: { type: "value", show: false, min: "dataMin" },
        tooltip: { show: false },
        series: [{ type: "line", data, smooth: true, areaStyle: { opacity: 0.12 } }]
      }, 80);
    }
  },
  {
    title: "Progress to Target",
    level: 1,
    desc: "How far a metric is towards a goal. The bar colour changes as it approaches or passes the target.",
    render(b) {
      const goals = [["Monthly production", 8420, 10000, "units"], ["Solar generation", 3120, 3000, "kWh"], ["Water savings", 1250, 4000, "L"]];
      b.innerHTML = goals.map(([l, v, t, u]) => {
        const pct = Math.round((v / t) * 100);
        const color = pct >= 100 ? "var(--rv-good)" : pct >= 60 ? "var(--rv-primary)" : "var(--rv-warn)";
        return `<div style="margin-bottom:14px">
          <div class="ax-row ax-row--between ax-small"><span>${l}</span><span><strong>${F.num(v)}</strong> / ${F.num(t)} ${u} (${pct}%)</span></div>
          <div class="ax-bar" style="margin-top:6px"><div style="width:${Math.min(pct, 100)}%;background:${color}"></div></div>
        </div>`;
      }).join("");
    }
  },
  {
    title: "Radial Gauge",
    level: 1,
    desc: "A classic dial for a single bounded value, such as load as a percentage of capacity.",
    render(b) {
      AX.chart(b, {
        series: [{
          type: "gauge", min: 0, max: 100, startAngle: 205, endAngle: -25, radius: "92%", center: ["50%", "58%"],
          axisLine: { roundCap: true, lineStyle: { width: 14, color: [[1, "#f0f0f2"]] } },
          progress: { show: true, roundCap: true, width: 14, itemStyle: { color: "#4f46e5" } },
          pointer: { show: false }, axisTick: { show: false }, splitLine: { show: false },
          axisLabel: { distance: -34, fontSize: 10.5, color: "#a1a1aa", formatter: v => (v === 0 || v === 100 ? v + "%" : "") },
          detail: { valueAnimation: true, formatter: "{value}%", fontSize: 34, fontWeight: 600, color: "#18181b", offsetCenter: [0, "-4%"] },
          title: { offsetCenter: [0, "26%"], fontSize: 12, color: "#a1a1aa" },
          data: [{ value: 72, name: "of rated capacity" }]
        }]
      }, 230);
    }
  },
  {
    title: "Status Lights",
    level: 1,
    desc: "Traffic-light indicators for system health. Good for showing many on/off or ok/warning/fault states.",
    render(b) {
      const systems = [["Main power", "Online"], ["Backup generator", "Online"], ["Cooling loop", "Warning"], ["Network gateway", "Online"], ["Fire panel", "Online"], ["Compressor B", "Offline"]];
      b.innerHTML = `<ul class="ax-list">${systems.map(([n, s]) => `
        <li><span class="ax-row" style="gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:${AX.STATUS_COLOR[s]};box-shadow:0 0 0 4px ${AX.STATUS_COLOR[s]}22"></span>${n}</span>${AX.pill(s)}</li>`).join("")}</ul>`;
    }
  },
  {
    title: "Battery Levels",
    level: 2,
    desc: "Battery icons per device, coloured by charge, with a count of devices that need attention.",
    render(b) {
      const devs = D.devices.slice(0, 12);
      const color = v => (v < 20 ? "var(--rv-bad)" : v < 45 ? "var(--rv-warn)" : "var(--rv-good)");
      const low = devs.filter(d => d.battery < 20).length;
      b.innerHTML = `
        <div class="ax-small" style="margin-bottom:10px"><span class="ax-pill ax-pill--bad">${low} low</span> <span class="ax-muted">below 20%</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px">${devs.map(d => `
          <div class="ax-small" title="${d.name}, ${d.site}">
            <svg viewBox="0 0 44 20" width="44" height="20" aria-hidden="true">
              <rect x="1" y="1" width="38" height="18" rx="3" fill="none" stroke="#d4d4d8" stroke-width="2"/>
              <rect x="40" y="6" width="3" height="8" rx="1" fill="#d4d4d8"/>
              <rect x="4" y="4" width="${(32 * d.battery) / 100}" height="12" rx="1.5" fill="${color(d.battery)}"/>
            </svg>
            <div><strong>${d.battery}%</strong> <span class="ax-muted">${d.id}</span></div>
          </div>`).join("")}</div>`;
    }
  },
  {
    title: "Tank Levels",
    level: 2,
    desc: "Fill-level vessels with volume, capacity and a high-level alarm line. Levels animate as they change.",
    render(b) {
      const tanks = [{ n: "Tank A", cap: 50000, lvl: 0.78 }, { n: "Tank B", cap: 30000, lvl: 0.42 }, { n: "Tank C", cap: 20000, lvl: 0.93 }];
      b.innerHTML = `<div class="ax-row" style="justify-content:space-around;align-items:flex-end">${tanks.map((t, i) => `
        <div style="text-align:center">
          <div style="position:relative;width:70px;height:140px;border:2px solid #d4d4d8;border-radius:8px 8px 12px 12px;overflow:hidden;background:#fafafa">
            <div data-tank="${i}" style="position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#6366f1,#4f46e5);transition:height 1s"></div>
            <div style="position:absolute;left:0;right:0;top:10%;border-top:2px dashed var(--rv-bad)" title="High level alarm (90%)"></div>
          </div>
          <div style="margin-top:6px;font-weight:600">${t.n}</div>
          <div class="ax-small ax-muted" data-tank-label="${i}"></div>
        </div>`).join("")}</div>`;
      const draw = () => tanks.forEach((t, i) => {
        b.querySelector(`[data-tank="${i}"]`).style.height = t.lvl * 100 + "%";
        b.querySelector(`[data-tank="${i}"]`).style.background = t.lvl > 0.9 ? "linear-gradient(#fca5a5,#ef4444)" : "linear-gradient(#6366f1,#4f46e5)";
        b.querySelector(`[data-tank-label="${i}"]`).textContent = `${Math.round(t.lvl * 100)}% · ${F.compact(t.lvl * t.cap)} / ${F.compact(t.cap)} L`;
      });
      requestAnimationFrame(draw);
      AX.every(3000, () => { tanks.forEach(t => { t.lvl = Math.min(0.98, Math.max(0.05, t.lvl + (Math.random() - 0.5) * 0.08)); }); draw(); }, b);
    }
  },
  {
    title: "Banded Gauge",
    level: 2,
    desc: "Gauge with normal, warning and critical bands. Switch between metrics to reuse the same widget.",
    render(b) {
      const metrics = {
        temp: { name: "Temperature", unit: "°C", min: 0, max: 60, value: 41, bands: [[0.6, "#10b981"], [0.8, "#f59e0b"], [1, "#ef4444"]] },
        pressure: { name: "Pressure", unit: "bar", min: 0, max: 10, value: 8.7, bands: [[0.5, "#10b981"], [0.85, "#f59e0b"], [1, "#ef4444"]] },
        vibration: { name: "Vibration", unit: "mm/s", min: 0, max: 20, value: 4.2, bands: [[0.4, "#10b981"], [0.7, "#f59e0b"], [1, "#ef4444"]] }
      };
      const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg([["temp", "Temperature"], ["pressure", "Pressure"], ["vibration", "Vibration"]], "temp")}</div>`);
      const opt = m => ({
        series: [{
          type: "gauge", min: m.min, max: m.max, splitNumber: 4, startAngle: 210, endAngle: -30, radius: "90%", center: ["50%", "56%"],
          axisLine: { lineStyle: { width: 8, color: m.bands } },
          pointer: { length: "58%", width: 4, offsetCenter: [0, 0], itemStyle: { color: "#18181b" } },
          anchor: { show: true, size: 12, itemStyle: { color: "#fff", borderColor: "#18181b", borderWidth: 3 } },
          axisTick: { show: false }, splitLine: { show: false },
          axisLabel: { distance: 16, fontSize: 10.5, color: "#a1a1aa" },
          title: { offsetCenter: [0, "86%"], fontSize: 12, color: "#a1a1aa" },
          detail: { formatter: `{value} ${m.unit}`, fontSize: 24, fontWeight: 600, color: "#18181b", offsetCenter: [0, "56%"] },
          data: [{ value: m.value, name: m.name }]
        }]
      });
      const c = AX.chart(b, opt(metrics.temp), 220);
      AX.onSeg(ctl.querySelector(".ax-seg"), v => c.setOption(opt(metrics[v])));
    }
  },
  {
    title: "Thermometer",
    level: 2,
    desc: "Vertical thermometer showing the current value plus today's minimum and maximum markers.",
    render(b) {
      const cur = 27.4, lo = 18.2, hi = 31.6, min = 0, max = 45;
      const pos = v => ((v - min) / (max - min)) * 100;
      b.innerHTML = `
        <div class="ax-row" style="justify-content:center;gap:40px;padding:6px 0 18px">
          <div style="position:relative;width:110px;height:190px">
            <div style="position:absolute;left:0;top:0;width:22px;height:170px;background:#f0f0f2;border-radius:11px">
              <div style="position:absolute;left:5px;right:5px;bottom:5px;height:calc(${pos(cur)}% - 10px);background:linear-gradient(#fca5a5,#ef4444);border-radius:7px"></div>
            </div>
            <div style="position:absolute;left:-6px;top:156px;width:34px;height:34px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 5px #f0f0f2"></div>
            ${[[hi, "Max"], [lo, "Min"]].map(([v, l]) => `
              <div style="position:absolute;left:28px;top:${170 - (170 * pos(v)) / 100}px;transform:translateY(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap">
                <span style="width:10px;height:1.5px;background:#d4d4d8"></span><span class="ax-small" style="color:var(--ink-3)">${l}</span><strong class="ax-small">${v}°</strong>
              </div>`).join("")}
          </div>
          <div>
            <div class="ax-kpi__label">Server room</div>
            <div class="ax-kpi__value">${cur}<span class="ax-kpi__unit">°C</span></div>
            <div class="ax-small" style="color:var(--ink-3);margin-top:4px">Range today ${lo}° to ${hi}°</div>
            <span class="ax-pill ax-pill--warn" style="margin-top:10px">Above 25° target</span>
          </div>
        </div>`;
    }
  },
  {
    title: "Bullet Charts",
    level: 2,
    desc: "Compact actual-vs-target bars over poor, ok and good ranges. Shows several KPIs in little space.",
    render(b) {
      const kpis = [["Output", 82, 90], ["Quality", 96, 95], ["Availability", 71, 85], ["Efficiency", 88, 80]];
      AX.chart(b, {
        grid: { left: 8, right: 24, top: 6, bottom: 4, containLabel: true },
        tooltip: { trigger: "axis", axisPointer: { type: "none" } },
        xAxis: { type: "value", max: 100, axisLabel: { formatter: "{value}%" } },
        // Second hidden category axis lets the actual bar sit centred on top of the range bands
        yAxis: [
          { type: "category", data: kpis.map(k => k[0]), inverse: true },
          { type: "category", data: kpis.map(k => k[0]), inverse: true, show: false }
        ],
        series: [
          ...[[60, "#f2f2f4"], [25, "#e4e4e7"], [15, "#d4d4d8"]].map(([v, c]) => ({
            type: "bar", stack: "bg", data: kpis.map(() => v), barWidth: 22, itemStyle: { color: c, borderRadius: 0 }, silent: true, tooltip: { show: false }
          })),
          { type: "bar", name: "Actual", yAxisIndex: 1, data: kpis.map(k => k[1]), barWidth: 8, z: 3, itemStyle: { color: "#18181b", borderRadius: 0 } },
          { type: "scatter", name: "Target", yAxisIndex: 1, data: kpis.map(k => k[2]), symbol: "rect", symbolSize: [3, 22], z: 4, itemStyle: { color: "#ef4444" } }
        ]
      }, 200);
    }
  },
  {
    title: "Live Value Ticker",
    level: 2,
    desc: "Value refreshes every 1.5 s, flashing green or red by direction, with session min, max and update count.",
    render(b) {
      let v = 101.3, lo = v, hi = v, n = 0;
      b.innerHTML = `
        <div class="ax-kpi__label">Line pressure (kPa) <span class="ax-pill ax-pill--live" style="margin-left:6px">Live</span></div>
        <div class="ax-kpi__value" data-v style="transition:color .4s">${v}</div>
        <div class="ax-small ax-muted" data-s></div>`;
      const valEl = b.querySelector("[data-v]"), stats = b.querySelector("[data-s]");
      const tick = () => {
        const prev = v;
        v = +(v + (Math.random() - 0.5) * 1.6).toFixed(1);
        lo = Math.min(lo, v); hi = Math.max(hi, v); n++;
        valEl.textContent = v;
        valEl.style.color = v > prev ? "var(--rv-good)" : v < prev ? "var(--rv-bad)" : "";
        setTimeout(() => { valEl.style.color = ""; }, 600);
        stats.textContent = `Min ${lo} · Max ${hi} · ${n} updates`;
      };
      tick();
      AX.every(1500, tick, b);
    }
  },
  {
    title: "Uptime Counter",
    level: 2,
    desc: "Counts up live from the last restart and shows availability over the last 30 days as a strip.",
    render(b) {
      const since = Date.now() - (D.DAY * 12 + 3600e3 * 7 + 1260e3);
      const days = Array.from({ length: 30 }, (_, i) => (i === 8 ? "Offline" : i === 19 || i === 20 ? "Warning" : "Online"));
      b.innerHTML = `
        <div class="ax-kpi__label">Running since ${F.dateTime(since)}</div>
        <div class="ax-kpi__value" data-up style="font-size:26px"></div>
        <div class="ax-small" style="margin:12px 0 6px">Last 30 days · <strong>99.4%</strong> available</div>
        <div style="display:flex;gap:3px">${days.map((s, i) => `<div title="Day ${i + 1}: ${s}" style="flex:1;height:26px;border-radius:3px;background:${AX.STATUS_COLOR[s]}"></div>`).join("")}</div>`;
      const up = b.querySelector("[data-up]");
      const tick = () => {
        let s = Math.floor((Date.now() - since) / 1000);
        const d = Math.floor(s / 86400); s %= 86400;
        up.textContent = `${d}d ${F.pad(Math.floor(s / 3600))}h ${F.pad(Math.floor((s % 3600) / 60))}m ${F.pad(s % 60)}s`;
      };
      tick();
      AX.every(1000, tick, b);
    }
  },
  {
    title: "Device Status Grid",
    level: 2,
    desc: "Every device as a coloured tile. Filter by status, and hover a tile for details.",
    render(b) {
      const counts = s => D.devices.filter(d => !s || d.status === s).length;
      const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg([["", `All ${counts()}`], ["Online", `Online ${counts("Online")}`], ["Warning", `Warning ${counts("Warning")}`], ["Offline", `Offline ${counts("Offline")}`]], "")}</div>`);
      const grid = AX.add(b, `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px"></div>`);
      const draw = f => {
        grid.innerHTML = D.devices.map(d => `<div title="${d.id} · ${d.name}\n${d.site}\n${d.status}, ${d.temp}°C" style="aspect-ratio:1;border-radius:5px;background:${AX.STATUS_COLOR[d.status]};opacity:${!f || d.status === f ? 1 : 0.12};transition:opacity .2s"></div>`).join("");
      };
      draw("");
      AX.onSeg(ctl.querySelector(".ax-seg"), draw);
    }
  },
  {
    title: "Control Switches",
    level: 2,
    desc: "On/off toggles that send a command to a device. Asks for confirmation, then calls pushPayload().",
    render(b) {
      const items = [["Pump 1", true, "DEV-1002"], ["Ventilation", false, "DEV-1004"], ["Lighting zone A", true, "DEV-1007"], ["Heater", false, "DEV-1010"]];
      b.innerHTML = `<ul class="ax-list">${items.map(([n, on, id], i) => `
        <li><span>${n} <span class="ax-small ax-muted">${id}</span></span>
          <label style="position:relative;width:42px;height:24px;cursor:pointer">
            <input type="checkbox" data-i="${i}" ${on ? "checked" : ""} style="opacity:0;width:0;height:0" aria-label="${n}">
            <span data-track style="position:absolute;inset:0;border-radius:12px;background:${on ? "var(--rv-primary)" : "#d4d4d8"};transition:background .2s"></span>
            <span data-knob style="position:absolute;top:3px;left:${on ? 21 : 3}px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)"></span>
          </label></li>`).join("")}</ul>`;
      const paint = (input, on) => {
        input.parentElement.querySelector("[data-track]").style.background = on ? "var(--rv-primary)" : "#d4d4d8";
        input.parentElement.querySelector("[data-knob]").style.left = on ? "21px" : "3px";
      };
      b.querySelectorAll("input").forEach(input => input.addEventListener("change", async () => {
        const [n, , id] = items[+input.dataset.i];
        const ok = await AX.modal({ title: `Turn ${input.checked ? "on" : "off"} ${n}?`, body: `This sends a command to ${id}.` });
        if (!ok) { input.checked = !input.checked; return; }
        paint(input, input.checked);
        AX.rv("pushPayload", { command: input.checked ? "on" : "off" }, 205813, "UID", id, Date.now());
      }));
    }
  },
  {
    title: "Setpoint Control",
    level: 3,
    desc: "Adjust a target with slider, stepper or typed value. Validates the range, shows pending vs applied, and sends on Apply.",
    render(b) {
      const MIN = 16, MAX = 28;
      let applied = 21.5, pending = applied;
      b.innerHTML = `
        <div class="ax-row ax-row--between">
          <div><div class="ax-kpi__label">Current</div><div class="ax-kpi__value">22.8<span class="ax-kpi__unit">°C</span></div></div>
          <div style="text-align:right"><div class="ax-kpi__label">Target</div><div class="ax-kpi__value" data-target style="color:var(--rv-primary)"></div></div>
        </div>
        <div class="ax-row" style="margin:14px 0 8px">
          <button class="ax-btn" data-step="-0.5" aria-label="Decrease">−</button>
          <input type="range" min="${MIN}" max="${MAX}" step="0.5" style="flex:1" aria-label="Setpoint">
          <button class="ax-btn" data-step="0.5" aria-label="Increase">+</button>
          <input class="ax-input" type="number" step="0.5" style="width:74px" aria-label="Setpoint value">
        </div>
        <div class="ax-row ax-row--between">
          <span class="ax-small" data-msg></span>
          <span class="ax-row" style="gap:6px"><button class="ax-btn" data-reset>Reset</button><button class="ax-btn ax-btn--primary" data-apply>Apply</button></span>
        </div>`;
      const range = b.querySelector("input[type=range]"), num = b.querySelector("input[type=number]");
      const msg = b.querySelector("[data-msg]"), apply = b.querySelector("[data-apply]");
      const sync = () => {
        const valid = pending >= MIN && pending <= MAX;
        range.value = num.value = pending;
        b.querySelector("[data-target]").innerHTML = `${pending}<span class="ax-kpi__unit">°C</span>`;
        apply.disabled = !valid || pending === applied;
        msg.innerHTML = !valid ? `<span class="ax-down">Must be between ${MIN} and ${MAX}</span>`
          : pending === applied ? `<span class="ax-pill ax-pill--good">Applied</span>` : `<span class="ax-pill ax-pill--warn">Pending change from ${applied}</span>`;
      };
      range.addEventListener("input", () => { pending = +range.value; sync(); });
      num.addEventListener("input", () => { pending = +num.value; sync(); });
      b.querySelectorAll("[data-step]").forEach(btn => btn.addEventListener("click", () => {
        pending = Math.min(MAX, Math.max(MIN, +(pending + +btn.dataset.step).toFixed(1))); sync();
      }));
      b.querySelector("[data-reset]").addEventListener("click", () => { pending = applied; sync(); });
      apply.addEventListener("click", () => {
        AX.rv("pushPayload", { setpoint: pending }, 205813, "UID", "DEV-1001", Date.now());
        applied = pending; sync();
      });
      sync();
    }
  },
  {
    title: "Period Scorecard",
    level: 3,
    desc: "A set of KPIs that all recalculate for the selected period, each with its change and a mini trend.",
    render(b) {
      const periods = { d: ["Today", 24, 1], w: ["7 days", 7, 7], m: ["30 days", 30, 30] };
      const metrics = [["Energy", "kWh", 1280, 101], ["Output", "units", 8200, 202], ["Downtime", "min", 42, 303], ["Alerts", "", 7, 404]];
      const ctl = AX.add(b, `<div class="ax-ctl">${AX.seg(Object.entries(periods).map(([k, p]) => [k, p[0]]), "d")}</div>`);
      const grid = AX.add(b, `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"></div>`);
      const draw = p => {
        const [, pts, mult] = periods[p];
        grid.innerHTML = "";
        metrics.forEach(([name, unit, base, seed], i) => {
          const vals = D.walk(pts, { base: base * (mult === 1 ? 1 / 24 : 1), vol: base * 0.03, min: 0, seed: seed + mult });
          const total = vals.reduce((a, c) => a + c, 0);
          const delta = +((D.rng(seed * mult)() - 0.45) * 20).toFixed(1);
          const good = name === "Downtime" || name === "Alerts" ? delta < 0 : delta > 0;
          const cell = AX.add(grid, `
            <div style="border:1px solid var(--rv-border);border-radius:8px;padding:10px 12px">
              <div class="ax-kpi__label">${name}</div>
              <div style="font-size:20px;font-weight:700">${F.compact(total)} <span class="ax-small ax-muted">${unit}</span></div>
              <div class="ax-small ${good ? "ax-up" : "ax-down"}">${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}%</div>
            </div>`);
          AX.chart(cell, {
            grid: { left: 0, right: 0, top: 4, bottom: 0 }, tooltip: { show: false },
            xAxis: { type: "category", show: false, data: vals.map((_, j) => j) }, yAxis: { type: "value", show: false, min: "dataMin" },
            series: [{ type: "bar", data: vals, itemStyle: { color: AX.PALETTE[i], borderRadius: 1 } }]
          }, 36);
        });
      };
      draw("d");
      AX.onSeg(ctl.querySelector(".ax-seg"), draw);
    }
  },
  {
    title: "Alarm Panel",
    level: 3,
    desc: "Active alarms with severity filter, per-alarm and bulk acknowledge, and live counts by severity.",
    render(b) {
      const sev = { critical: "bad", major: "warn", minor: "info" };
      const alarms = [
        ["critical", "Compressor B tripped", "Melbourne Depot", 4], ["major", "High temperature on Chiller 2", "Sydney Plant", 11],
        ["major", "Low battery on Sensor Hub 3", "Perth Terminal", 26], ["minor", "Door left open", "Brisbane Hub", 38],
        ["critical", "Loss of comms: Gateway 4", "Townsville Yard", 52], ["minor", "Filter change due", "Adelaide Works", 95]
      ].map(([s, t, site, m], i) => ({ i, s, t, site, m, ack: false }));
      let filter = "";
      b.innerHTML = `<div class="ax-ctl" data-ctl></div><ul class="ax-list" data-list></ul>`;
      const ctl = b.querySelector("[data-ctl]"), list = b.querySelector("[data-list]");
      const draw = () => {
        const open = alarms.filter(a => !a.ack);
        const c = s => open.filter(a => a.s === s).length;
        ctl.innerHTML = `${AX.seg([["", `All ${open.length}`], ["critical", `Critical ${c("critical")}`], ["major", `Major ${c("major")}`], ["minor", `Minor ${c("minor")}`]], filter)}
          <button class="ax-btn ax-btn--sm" data-all ${open.length ? "" : "disabled"} style="margin-left:auto">Acknowledge all</button>`;
        const shown = alarms.filter(a => !filter || a.s === filter);
        list.innerHTML = shown.length ? shown.map(a => `
          <li style="opacity:${a.ack ? 0.45 : 1}">
            <span><span class="ax-pill ax-pill--${sev[a.s]}">${a.s}</span> ${a.t}<br><span class="ax-small ax-muted">${a.site} · ${a.m} min ago</span></span>
            ${a.ack ? '<span class="ax-small ax-muted">Acknowledged</span>' : `<button class="ax-btn ax-btn--sm" data-ack="${a.i}">Ack</button>`}
          </li>`).join("") : '<li class="ax-muted">No alarms</li>';
      };
      b.addEventListener("click", e => {
        const s = e.target.closest(".ax-seg button");
        if (s) { filter = s.dataset.v; draw(); }
        if (e.target.dataset.ack) { alarms[+e.target.dataset.ack].ack = true; AX.toast("Alarm acknowledged", "good"); draw(); }
        if (e.target.hasAttribute("data-all")) { alarms.forEach(a => { a.ack = true; }); AX.toast("All alarms acknowledged", "good"); draw(); }
      });
      draw();
    }
  },
  {
    title: "Weighted Health Score",
    level: 3,
    desc: "A composite score built from several sub-metrics. Change the weights and the score recalculates live.",
    render(b) {
      const parts = [{ n: "Availability", v: 96, w: 40 }, { n: "Performance", v: 78, w: 30 }, { n: "Quality", v: 91, w: 20 }, { n: "Safety", v: 100, w: 10 }];
      const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center"></div>`);
      const gaugeBox = AX.add(wrap, `<div></div>`);
      const sliders = AX.add(wrap, `<div>${parts.map((p, i) => `
        <div class="ax-small" style="margin-bottom:8px">
          <div class="ax-row ax-row--between"><span>${p.n} <strong>${p.v}</strong></span><span class="ax-muted" data-w="${i}">${p.w}%</span></div>
          <input type="range" min="0" max="100" value="${p.w}" data-i="${i}" style="width:100%" aria-label="${p.n} weight">
        </div>`).join("")}</div>`);
      const score = () => {
        const tw = parts.reduce((a, p) => a + p.w, 0) || 1;
        return Math.round(parts.reduce((a, p) => a + p.v * p.w, 0) / tw);
      };
      const opt = s => ({
        series: [{
          type: "gauge", startAngle: 90, endAngle: -270, pointer: { show: false }, progress: { show: true, roundCap: true, width: 14, itemStyle: { color: s >= 90 ? "#10b981" : s >= 75 ? "#f59e0b" : "#ef4444" } },
          axisLine: { lineStyle: { width: 14 } }, splitLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false },
          detail: { offsetCenter: [0, 0], fontSize: 30, fontWeight: 700, formatter: "{value}" }, title: { offsetCenter: [0, "32%"], fontSize: 11, color: "#71717a" },
          data: [{ value: s, name: "Health score" }]
        }]
      });
      const c = AX.chart(gaugeBox, opt(score()), 190);
      sliders.addEventListener("input", e => {
        const i = +e.target.dataset.i;
        parts[i].w = +e.target.value;
        sliders.querySelector(`[data-w="${i}"]`).textContent = parts[i].w + "%";
        c.setOption(opt(score()));
      });
    }
  },
  {
    title: "Asset Drill-Down Card",
    level: 3,
    wide: true,
    desc: "Pick any device to see its overview, 7-day trend and alert history in tabs. One widget for every asset.",
    render(b) {
      const ctl = AX.add(b, `<div class="ax-ctl">
        <select class="ax-select" aria-label="Device">${D.devices.map(d => `<option value="${d.id}">${d.id} · ${d.name} (${d.site})</option>`).join("")}</select>
        ${AX.seg([["overview", "Overview"], ["trend", "Trend"], ["alerts", "Alerts"]], "overview")}
      </div>`);
      const pane = AX.add(b, `<div></div>`);
      let tab = "overview";
      const draw = () => {
        const d = D.devices.find(x => x.id === ctl.querySelector("select").value);
        const seed = +d.id.slice(4);
        pane.innerHTML = "";
        if (tab === "overview") {
          pane.innerHTML = `
            <div class="ax-row" style="gap:10px;margin-bottom:12px">${AX.pill(d.status)}<span class="ax-small ax-muted">Firmware ${d.firmware} · installed ${F.date(d.installed)} · last seen ${d.lastSeen} min ago</span></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">
              ${[["Temperature", d.temp, "°C"], ["Humidity", d.humidity, "%"], ["Power", d.power, "kW"], ["Battery", d.battery, "%"], ["Uptime", d.uptime, "%"], ["Open alerts", d.alerts, ""]].map(([l, v, u]) => `
                <div style="border:1px solid var(--rv-border);border-radius:8px;padding:10px 12px"><div class="ax-kpi__label">${l}</div><div style="font-size:20px;font-weight:700">${v}<span class="ax-kpi__unit">${u}</span></div></div>`).join("")}
            </div>`;
        } else if (tab === "trend") {
          const n = 7 * 24;
          AX.chart(pane, {
            legend: { top: 0 },
            xAxis: { type: "time" }, yAxis: [{ type: "value", name: "°C" }, { type: "value", name: "kW" }],
            series: [
              { type: "line", name: "Temperature", data: D.ts(n, D.HOUR, D.wave(n, { base: d.temp, amp: 3, noise: 1, seed })) },
              { type: "line", name: "Power", yAxisIndex: 1, data: D.ts(n, D.HOUR, D.walk(n, { base: d.power, vol: 1.5, min: 0, seed: seed + 1 })) }
            ]
          }, 240);
        } else {
          const rand = D.rng(seed);
          const rows = Array.from({ length: d.alerts + 2 }, (_, i) => [["High temperature", "Low battery", "Comms lost", "Threshold breach"][Math.floor(rand() * 4)], Date.now() - (i + 1) * rand() * 2 * D.DAY, i < d.alerts ? "Open" : "Closed"]);
          pane.innerHTML = `<ul class="ax-list">${rows.map(([t, when, s]) => `<li><span>${t}<br><span class="ax-small ax-muted">${F.dateTime(when)}</span></span><span class="ax-pill ax-pill--${s === "Open" ? "bad" : "good"}">${s}</span></li>`).join("")}</ul>`;
        }
      };
      ctl.querySelector("select").addEventListener("change", draw);
      AX.onSeg(ctl.querySelector(".ax-seg"), v => { tab = v; draw(); });
      draw();
    }
  }
]);
</script>
<script>
/* ==========================================================================
 * Assorted Charts: 20 chart families, simple to advanced
 * ========================================================================== */
AX.section("charts", [
  {
    title: "Basic Line",
    level: 1,
    desc: "One series over categories. The default way to show a trend.",
    render(b) {
      AX.chart(b, {
        xAxis: { type: "category", data: D.days },
        yAxis: { type: "value" },
        series: [{ type: "line", name: "Output", data: [820, 932, 901, 934, 1290, 1330, 1320], symbol: "circle", symbolSize: 6 }]
      });
    }
  },
  {
    title: "Smooth Area",
    level: 1,
    desc: "Curved line with filled area underneath, which emphasises volume over time.",
    render(b) {
      AX.chart(b, {
        xAxis: { type: "category", boundaryGap: false, data: D.months },
        yAxis: { type: "value" },
        series: [{
          type: "line", name: "Visitors", smooth: true, data: D.wave(12, { base: 520, amp: 160, period: 12, noise: 30, seed: 4 }),
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: "rgba(79,70,229,.35)" }, { offset: 1, color: "rgba(79,70,229,0)" }]) }
        }]
      });
    }
  },
  {
    title: "Scatter Plot",
    level: 1,
    desc: "Each point is one device. Shows the relationship between two measures.",
    render(b) {
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => `${p.data[2]}<br>${p.data[0]}°C, ${p.data[1]} kW` },
        xAxis: { type: "value", name: "Temp °C", scale: true },
        yAxis: { type: "value", name: "Power kW" },
        series: [{ type: "scatter", symbolSize: 9, data: D.devices.map(d => [d.temp, d.power, d.id]) }]
      });
    }
  },
  {
    title: "Radar",
    level: 1,
    desc: "Compares several entities across many dimensions at once, like site performance profiles.",
    render(b) {
      AX.chart(b, {
        legend: { bottom: 0 },
        radar: { indicator: ["Uptime", "Output", "Quality", "Safety", "Efficiency", "Cost"].map(n => ({ name: n, max: 100 })), radius: "62%", axisName: { color: "#71717a", fontSize: 11 } },
        series: [{
          type: "radar", areaStyle: { opacity: 0.15 },
          data: [{ name: "Sydney", value: [96, 82, 90, 99, 75, 68] }, { name: "Melbourne", value: [88, 91, 84, 95, 88, 80] }, { name: "Perth", value: [92, 70, 95, 100, 64, 90] }]
        }]
      }, 260);
    }
  },
  {
    title: "Funnel",
    level: 1,
    desc: "Stage-by-stage drop-off, for example sensor readings that pass each validation step.",
    render(b) {
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: "{b}: {c}" },
        series: [{
          type: "funnel", left: "4%", width: "62%", top: 8, bottom: 8, sort: "descending", gap: 3, minSize: "30%",
          itemStyle: { borderWidth: 0, borderRadius: 4 },
          label: { position: "right", color: "#52525b", fontSize: 12, formatter: p => `{n|${p.name}}  {v|${F.num(p.value)}}` , rich: { n: { color: "#52525b", fontSize: 12 }, v: { color: "#18181b", fontWeight: 600, fontSize: 12 } } },
          labelLine: { length: 12, lineStyle: { color: "#e0e0e5" } },
          // Single hue, light to dark: a funnel is one measure, not five categories
          data: [["Received", 10000], ["Parsed", 9620], ["Validated", 8810], ["Enriched", 8400], ["Stored", 8390]].map(([name, value], i) => ({ name, value, itemStyle: { color: ["#c7d2fe", "#a5b4fc", "#818cf8", "#6366f1", "#4f46e5"][i] } }))
        }]
      });
    }
  },
  {
    title: "Bubble Chart",
    level: 2,
    desc: "Scatter with a third measure as bubble size and a fourth as colour: temp, power, alerts and device type.",
    render(b) {
      AX.chart(b, {
        legend: { top: 0, type: "scroll" },
        tooltip: { trigger: "item", formatter: p => `${p.data[3]} (${p.seriesName})<br>${p.data[0]}°C · ${p.data[1]} kW · ${p.data[2]} alerts` },
        xAxis: { type: "value", name: "°C", scale: true }, yAxis: { type: "value", name: "kW" },
        series: D.types.map(t => ({
          type: "scatter", name: t, symbolSize: v => 8 + v[2] * 5, itemStyle: { opacity: 0.7 },
          data: D.devices.filter(d => d.type === t).map(d => [d.temp, d.power, d.alerts, d.id])
        }))
      }, 260);
    }
  },
  {
    title: "Heatmap",
    level: 2,
    desc: "Day by hour grid coloured by value. Reveals weekly and daily usage patterns at a glance.",
    render(b) {
      const rand = D.rng(9), data = [];
      D.days.forEach((_, d) => D.hours.forEach((_, h) => {
        const work = d < 5 && h >= 7 && h <= 18;
        data.push([h, d, Math.round((work ? 60 : 15) + rand() * 30 + (h === 12 ? -10 : 0))]);
      }));
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => `${D.days[p.data[1]]} ${D.hours[p.data[0]]}: ${p.data[2]} kWh` },
        grid: { left: 8, right: 8, top: 8, bottom: 58, containLabel: true },
        xAxis: { type: "category", data: D.hours, splitArea: { show: true }, axisLabel: { interval: 2 } },
        yAxis: { type: "category", data: D.days, splitArea: { show: true } },
        visualMap: { min: 0, max: 100, calculable: true, orient: "horizontal", left: "center", bottom: 0, itemHeight: 120, inRange: { color: ["#eef0ff", "#818cf8", "#4f46e5", "#312e81"] } },
        series: [{ type: "heatmap", data, itemStyle: { borderColor: "#fff", borderWidth: 1 } }]
      }, 260);
    }
  },
  {
    title: "Treemap",
    level: 2,
    desc: "Nested rectangles sized by value. Click a region to zoom in, use the breadcrumb to go back.",
    render(b) {
      const regions = [...new Set(D.sites.map(s => s.region))];
      const data = regions.map(r => ({
        name: r,
        children: D.sites.filter(s => s.region === r).map(s => ({
          name: s.name,
          children: D.types.map(t => ({ name: t, value: Math.round(D.devices.filter(d => d.site === s.name && d.type === t).reduce((a, d) => a + d.power, 0) * 10) / 10 })).filter(c => c.value)
        }))
      }));
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => `${p.treePathInfo.map(x => x.name).filter(Boolean).join(" / ")}: ${F.num(p.value, 1)} kW` },
        series: [{
          type: "treemap", data, top: 4, left: 0, right: 0, bottom: 28, leafDepth: 1, roam: false,
          breadcrumb: { bottom: 0, itemStyle: { color: "#f0f0f2", textStyle: { color: "#18181b" } } },
          label: { fontSize: 11 }, upperLabel: { show: true, height: 18, fontSize: 11, color: "#fff" },
          levels: [{ itemStyle: { borderWidth: 2, gapWidth: 2, borderColor: "#fff" } }, { itemStyle: { gapWidth: 1 }, colorSaturation: [0.35, 0.6] }]
        }]
      }, 280);
    }
  },
  {
    title: "Sunburst",
    level: 2,
    desc: "Hierarchy as rings: region, then site, then device type. Click a segment to focus on it.",
    render(b) {
      const regions = [...new Set(D.sites.map(s => s.region))];
      const data = regions.map(r => ({
        name: r,
        children: D.sites.filter(s => s.region === r).map(s => ({
          name: s.name.split(" ")[0],
          children: D.types.map(t => ({ name: t, value: D.devices.filter(d => d.site === s.name && d.type === t).length })).filter(c => c.value)
        }))
      }));
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: "{b}: {c} devices" },
        series: [{
          type: "sunburst", data, radius: [20, "95%"], sort: null, itemStyle: { borderColor: "#fff", borderWidth: 1.5 },
          levels: [{}, { r0: 20, r: 70, label: { rotate: 0, fontSize: 12, fontWeight: 600 } }, { r0: 70, r: 115, label: { fontSize: 10 } }, { r0: 115, r: 128, label: { show: false }, itemStyle: { opacity: 0.75 } }]
        }]
      }, 280);
    }
  },
  {
    title: "Box Plot",
    level: 2,
    desc: "Distribution summary per site: median, quartiles and range. Spots sites with unusual spread.",
    render(b) {
      const stats = arr => {
        const s = [...arr].sort((x, y) => x - y), q = p => s[Math.floor((s.length - 1) * p)];
        return [s[0], q(0.25), q(0.5), q(0.75), s[s.length - 1]];
      };
      const names = D.sites.map(s => s.id);
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => `${p.name}<br>Max ${p.data[5]}<br>Q3 ${p.data[4]}<br>Median ${p.data[3]}<br>Q1 ${p.data[2]}<br>Min ${p.data[1]}` },
        xAxis: { type: "category", data: names }, yAxis: { type: "value", name: "°C", scale: true },
        series: [{ type: "boxplot", itemStyle: { color: "#eef0ff", borderColor: "#4f46e5" }, data: names.map((_, i) => stats(D.wave(200, { base: 20 + i, amp: 3 + (i % 3) * 2, noise: 3, seed: i + 20 }))) }]
      });
    }
  },
  {
    title: "Wind Rose (Polar)",
    level: 2,
    desc: "Polar stacked bars by compass direction and speed band. Ideal for directional data like wind or flow.",
    render(b) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      const bands = [["0-10 km/h", [5, 3, 2, 4, 8, 6, 4, 3]], ["10-20 km/h", [4, 2, 1, 3, 9, 7, 3, 2]], ["20+ km/h", [1, 1, 0, 1, 5, 4, 2, 1]]];
      AX.chart(b, {
        legend: { bottom: 0 },
        tooltip: { trigger: "item" },
        polar: { radius: [10, "72%"], center: ["50%", "46%"] },
        angleAxis: { type: "category", data: dirs, startAngle: 112.5, axisLabel: { color: "#71717a" } },
        radiusAxis: { axisLabel: { show: false }, axisLine: { show: false } },
        series: bands.map(([name, data]) => ({ type: "bar", name, data, coordinateSystem: "polar", stack: "w" }))
      }, 270);
    }
  },
  {
    title: "Candlestick",
    level: 2,
    desc: "Open, close, low and high per day. Used for energy spot prices or any value with a daily range.",
    render(b) {
      const rand = D.rng(5);
      let last = 120;
      const days = [], data = [];
      for (let i = 30; i > 0; i--) {
        const open = last, close = +(open + (rand() - 0.5) * 20).toFixed(1);
        data.push([open, close, +(Math.min(open, close) - rand() * 8).toFixed(1), +(Math.max(open, close) + rand() * 8).toFixed(1)]);
        days.push(F.date(Date.now() - i * D.DAY));
        last = close;
      }
      AX.chart(b, {
        xAxis: { type: "category", data: days, axisLabel: { interval: 4 } }, yAxis: { type: "value", scale: true, name: "$/MWh" },
        series: [{ type: "candlestick", data, itemStyle: { color: "#10b981", color0: "#ef4444", borderColor: "#10b981", borderColor0: "#ef4444" } }]
      });
    }
  },
  {
    title: "Theme River",
    level: 2,
    desc: "Stream graph of how the mix of categories changes over time, here alert types per week.",
    render(b) {
      const cats = ["Temperature", "Battery", "Comms", "Pressure"];
      const data = [];
      for (let w = 0; w < 16; w++) {
        const day = F.iso(Date.now() - (16 - w) * 7 * D.DAY);
        cats.forEach((c, i) => data.push([day, Math.round(10 + 8 * Math.sin((w + i * 3) / 3) + i * 3), c]));
      }
      AX.chart(b, {
        legend: { top: 0 }, tooltip: { trigger: "axis", axisPointer: { type: "line" } },
        singleAxis: { type: "time", top: 40, bottom: 24, axisLabel: { color: "#71717a" } },
        series: [{ type: "themeRiver", data, label: { show: false } }]
      }, 260);
    }
  },
  {
    title: "Sankey Energy Flow",
    level: 3,
    desc: "Shows how quantities flow from sources to uses. Hover a link to see each flow amount.",
    render(b) {
      const links = [
        ["Grid", "Main board", 620], ["Solar", "Main board", 240], ["Battery", "Main board", 80],
        ["Main board", "HVAC", 380], ["Main board", "Production", 360], ["Main board", "Lighting", 110], ["Main board", "Losses", 90],
        ["HVAC", "Chillers", 260], ["HVAC", "Fans", 120], ["Production", "Line A", 210], ["Production", "Line B", 150]
      ];
      const names = [...new Set(links.flatMap(l => [l[0], l[1]]))];
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => (p.dataType === "edge" ? `${p.data.source} → ${p.data.target}: ${p.data.value} kWh` : `${p.name}`) },
        series: [{
          type: "sankey", left: 4, right: 70, top: 6, bottom: 6, nodeGap: 10, emphasis: { focus: "adjacency" },
          lineStyle: { color: "gradient", opacity: 0.35, curveness: 0.5 }, label: { fontSize: 11 },
          data: names.map(name => ({ name })), links: links.map(([source, target, value]) => ({ source, target, value }))
        }]
      }, 280);
    }
  },
  {
    title: "Network Topology",
    level: 3,
    desc: "Force-directed graph of gateways and devices. Drag nodes, scroll to zoom, hover to highlight links.",
    render(b) {
      const nodes = [{ name: "Cloud", symbolSize: 34, category: 0 }];
      const links = [];
      D.sites.forEach(s => {
        nodes.push({ name: s.id + " gateway", symbolSize: 20, category: 1 });
        links.push({ source: "Cloud", target: s.id + " gateway" });
      });
      D.devices.slice(0, 40).forEach(d => {
        nodes.push({ name: d.id, symbolSize: 9, category: d.status === "Online" ? 2 : d.status === "Warning" ? 3 : 4, value: `${d.name}, ${d.status}` });
        links.push({ source: d.siteId + " gateway", target: d.id });
      });
      AX.chart(b, {
        legend: { top: 0, data: ["Gateway", "Online", "Warning", "Offline"] },
        tooltip: { trigger: "item", formatter: p => (p.dataType === "node" ? `${p.name}${p.data.value ? "<br>" + p.data.value : ""}` : "") },
        series: [{
          type: "graph", layout: "force", roam: true, draggable: true, top: 30, force: { repulsion: 70, edgeLength: [20, 60] },
          categories: [{ name: "Cloud", itemStyle: { color: "#18181b" } }, { name: "Gateway", itemStyle: { color: "#4f46e5" } }, { name: "Online", itemStyle: { color: "#10b981" } }, { name: "Warning", itemStyle: { color: "#f59e0b" } }, { name: "Offline", itemStyle: { color: "#ef4444" } }],
          data: nodes, links, lineStyle: { color: "#d4d4d8" }, emphasis: { focus: "adjacency" }
        }]
      }, 300);
    }
  },
  {
    title: "Parallel Coordinates",
    level: 3,
    desc: "Each line is a device across six measures. Drag along any axis to brush and filter the lines.",
    render(b) {
      const dims = [["temp", "Temp"], ["humidity", "Humidity"], ["power", "Power"], ["battery", "Battery"], ["uptime", "Uptime"], ["alerts", "Alerts"]];
      AX.chart(b, {
        tooltip: { show: false },
        parallelAxis: dims.map(([, name], dim) => ({ dim, name, nameTextStyle: { color: "#71717a", fontSize: 11 }, axisLabel: { color: "#71717a", fontSize: 10 } })),
        parallel: { left: 30, right: 40, top: 30, bottom: 20 },
        visualMap: { show: false, dimension: 0, min: 16, max: 34, inRange: { color: ["#4f46e5", "#f59e0b", "#ef4444"] } },
        series: [{ type: "parallel", lineStyle: { width: 1.2, opacity: 0.55 }, inactiveOpacity: 0.04, data: D.devices.map(d => dims.map(([k]) => d[k])) }]
      }, 280);
    }
  },
  {
    title: "Calendar Heatmap",
    level: 3,
    desc: "A full year of daily values on a calendar grid. Spot seasonal trends, weekends and outages.",
    wide: true,
    render(b) {
      const year = new Date().getFullYear() - 1;
      const rand = D.rng(31), data = [];
      for (let t = Date.UTC(year, 0, 1); t < Date.UTC(year + 1, 0, 1); t += D.DAY) {
        const d = new Date(t), dow = d.getUTCDay(), season = Math.cos(((d.getUTCMonth() + 0.5) / 12) * 2 * Math.PI);
        data.push([F.iso(t), Math.round(dow === 0 || dow === 6 ? 200 + rand() * 80 : 420 + season * 120 + rand() * 90)]);
      }
      AX.chart(b, {
        tooltip: { trigger: "item", formatter: p => `${p.data[0]}: ${p.data[1]} kWh` },
        visualMap: { min: 150, max: 650, orient: "horizontal", left: "center", bottom: 0, itemHeight: 140, calculable: true, inRange: { color: ["#eef0ff", "#a5b4fc", "#4f46e5", "#312e81"] } },
        calendar: { range: String(year), top: 26, left: 36, right: 10, cellSize: ["auto", 15], itemStyle: { borderColor: "#fff", borderWidth: 2 }, splitLine: { show: false }, dayLabel: { color: "#71717a", fontSize: 10 }, monthLabel: { color: "#71717a", fontSize: 11 }, yearLabel: { show: false } },
        series: [{ type: "heatmap", coordinateSystem: "calendar", data }]
      }, 210);
    }
  },
  {
    title: "Brush Selection + Regression",
    level: 3,
    desc: "Fitted trend line with its equation and R². Drag a box over points to select them and see live stats.",
    render(b) {
      const pts = D.devices.map(d => [d.temp, +(d.temp * 0.9 + d.power * 0.4 - 6).toFixed(1)]);
      const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
      const slope = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
      const icpt = my - slope * mx;
      const r2 = 1 - pts.reduce((a, p) => a + (p[1] - (slope * p[0] + icpt)) ** 2, 0) / pts.reduce((a, p) => a + (p[1] - my) ** 2, 0);
      const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
      const info = AX.add(b, `<div class="ax-ctl"><span class="ax-pill ax-pill--info">y = ${slope.toFixed(2)}x ${icpt >= 0 ? "+" : "−"} ${Math.abs(icpt).toFixed(2)}</span><span class="ax-pill ax-pill--info">R² = ${r2.toFixed(2)}</span><span class="ax-small ax-muted" data-sel>Drag on the chart to select points</span></div>`);
      const c = AX.chart(b, {
        tooltip: { trigger: "item" },
        brush: { toolbox: ["rect", "clear"], xAxisIndex: 0, throttleType: "debounce", throttleDelay: 150, inBrush: { color: "#ef4444" } },
        toolbox: { right: 8, top: 0, feature: { brush: { title: { rect: "Box select", clear: "Clear" } } } },
        grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },
        xAxis: { type: "value", name: "Temp", scale: true }, yAxis: { type: "value", name: "Load index", scale: true },
        series: [
          { type: "scatter", data: pts, symbolSize: 8 },
          { type: "line", data: [[x0, slope * x0 + icpt], [x1, slope * x1 + icpt]], lineStyle: { type: "dashed", color: "#ef4444" }, tooltip: { show: false }, silent: true }
        ]
      }, 250);
      c.dispatchAction({ type: "takeGlobalCursor", key: "brush", brushOption: { brushType: "rect" } });
      c.on("brushSelected", e => {
        const idx = e.batch[0].selected[0].dataIndex;
        const sel = info.querySelector("[data-sel]");
        if (!idx.length) { sel.textContent = "Drag on the chart to select points"; return; }
        const avg = k => (idx.reduce((a, i) => a + pts[i][k], 0) / idx.length).toFixed(1);
        sel.innerHTML = `<strong>${idx.length}</strong> selected · avg temp ${avg(0)} · avg load ${avg(1)}`;
      });
    }
  },
  {
    title: "Cross-Filtered Charts",
    level: 3,
    wide: true,
    desc: "Click a slice in the donut to filter the scatter and summary. Click it again to clear. Charts talk to each other.",
    render(b) {
      let active = null;
      const wrap = AX.add(b, `<div style="display:grid;grid-template-columns:1fr 2fr;gap:12px"></div>`);
      const left = AX.add(wrap, "<div></div>"), right = AX.add(wrap, "<div></div>");
      const summary = AX.add(right, `<div class="ax-ctl"></div>`);
      const pie = AX.chart(left, {
        tooltip: { trigger: "item", formatter: "{b}: {c} devices" },
        series: [{ type: "pie", radius: ["45%", "75%"], selectedMode: "single", label: { fontSize: 10 }, data: D.types.map(t => ({ name: t, value: D.devices.filter(d => d.type === t).length })) }]
      }, 250);
      const scatter = AX.chart(right, {
        tooltip: { trigger: "item", formatter: p => `${p.data[2]}<br>${p.data[0]}°C, ${p.data[1]} kW` },
        xAxis: { type: "value", name: "°C", scale: true }, yAxis: { type: "value", name: "kW" }, series: [{ type: "scatter", symbolSize: 9, data: [] }]
      }, 210);
      const draw = () => {
        const rows = D.devices.filter(d => !active || d.type === active);
        scatter.setOption({ series: [{ data: rows.map(d => [d.temp, d.power, d.id]), itemStyle: { color: active ? AX.PALETTE[D.types.indexOf(active)] : "#4f46e5" } }] });
        const avg = k => (rows.reduce((a, d) => a + d[k], 0) / rows.length).toFixed(1);
        summary.innerHTML = `<span class="ax-pill ax-pill--info">${active || "All types"}</span><span class="ax-small">${rows.length} devices · avg ${avg("temp")}°C · avg ${avg("power")} kW · ${rows.filter(d => d.status !== "Online").length} not online</span>`;
      };
      pie.on("click", p => { active = active === p.name ? null : p.name; draw(); });
      draw();
    }
  },
  {
    title: "Dimension Explorer",
    level: 3,
    wide: true,
    desc: "Build your own chart: choose the X, Y, size and colour fields plus the chart type. Every combination works.",
    render(b) {
      const num = [["temp", "Temperature"], ["humidity", "Humidity"], ["power", "Power"], ["battery", "Battery"], ["uptime", "Uptime"], ["alerts", "Alerts"]];
      const cat = [["type", "Device type"], ["site", "Site"], ["status", "Status"], ["region", "Region"]];
      const sel = (k, opts, v) => `<label>${k} <select class="ax-select" data-k="${k}">${opts.map(([val, l]) => `<option value="${val}" ${val === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;
      const ctl = AX.add(b, `<div class="ax-ctl">
        ${sel("Chart", [["scatter", "Scatter"], ["bar", "Bar (average by colour field)"], ["box", "Range by colour field"]], "scatter")}
        ${sel("X", num, "temp")} ${sel("Y", num, "power")} ${sel("Size", [["", "None"], ...num], "alerts")} ${sel("Colour", cat, "type")}
      </div>`);
      const c = AX.chart(b, { xAxis: {}, yAxis: {}, series: [] }, 300);
      const draw = () => {
        const v = k => ctl.querySelector(`[data-k="${k}"]`).value;
        const [type, x, y, size, color] = ["Chart", "X", "Y", "Size", "Colour"].map(v);
        const label = k => [...num, ...cat].find(o => o[0] === k)[1];
        const groups = [...new Set(D.devices.map(d => d[color]))];
        ctl.querySelectorAll('[data-k="X"],[data-k="Size"]').forEach(s => { s.disabled = type !== "scatter"; });
        let opt;
        if (type === "scatter") {
          const sizes = size ? D.devices.map(d => d[size]) : [1];
          const lo = Math.min(...sizes), hi = Math.max(...sizes) || 1;
          opt = {
            legend: { top: 0, type: "scroll" }, tooltip: { trigger: "item", formatter: p => `${p.data[2]} (${p.seriesName})<br>${label(x)} ${p.data[0]}<br>${label(y)} ${p.data[1]}` },
            xAxis: { type: "value", name: label(x), scale: true }, yAxis: { type: "value", name: label(y), scale: true },
            series: groups.map(g => ({
              type: "scatter", name: g, itemStyle: { opacity: 0.75 },
              symbolSize: p => (size ? 6 + ((p[3] - lo) / (hi - lo || 1)) * 22 : 9),
              data: D.devices.filter(d => d[color] === g).map(d => [d[x], d[y], d.id, size ? d[size] : 0])
            }))
          };
        } else {
          const vals = g => D.devices.filter(d => d[color] === g).map(d => d[y]);
          opt = type === "bar"
            ? { tooltip: { trigger: "axis" }, xAxis: { type: "category", data: groups }, yAxis: { type: "value", name: `Avg ${label(y)}` }, series: [{ type: "bar", data: groups.map(g => +(vals(g).reduce((a, c) => a + c, 0) / vals(g).length).toFixed(2)), colorBy: "data" }] }
            : { tooltip: { trigger: "axis" }, xAxis: { type: "category", data: groups }, yAxis: { type: "value", name: label(y), scale: true }, series: [
                { type: "bar", stack: "r", data: groups.map(g => Math.min(...vals(g))), itemStyle: { color: "transparent" }, tooltip: { show: false } },
                { type: "bar", stack: "r", name: "Range", data: groups.map(g => +(Math.max(...vals(g)) - Math.min(...vals(g))).toFixed(2)), itemStyle: { borderRadius: 4 } }
              ] };
        }
        opt.grid = { left: 8, right: 24, top: 36, bottom: 8, containLabel: true };
        c.setOption(opt, true);
      };
      ctl.addEventListener("change", draw);
      draw();
    }
  }
]);
</script>
<script>
/* ==========================================================================
 * Time Series: 20 examples, simple to advanced
 * ========================================================================== */
(() => {
  const MIN = 60e3, HOUR = D.HOUR, DAY = D.DAY;
  const timeAxis = (extra = {}) => ({ type: "time", ...extra });

  /* Hourly-cycle sensor data: [[ms, v], ...] */
  const sensor = (n, step, { base = 22, amp = 4, noise = 1, seed = 1, period } = {}) =>
    D.ts(n, step, D.wave(n, { base, amp, noise, seed, period: period || Math.round(DAY / step) }));

  const avg = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);

  /* Bucket [[t, v]] into windows of `size` ms using `fn` over values */
  function bucket(data, size, fn = avg) {
    const map = new Map();
    data.forEach(([t, v]) => {
      const k = Math.floor(t / size) * size;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(v);
    });
    return [...map].map(([t, vals]) => [t, +fn(vals).toFixed(2)]);
  }

  AX.section("timeseries", [
    {
      title: "Single Series",
      level: 1,
      desc: "One sensor over the last 24 hours on a real time axis. The starting point for any time series.",
      render(b) {
        AX.chart(b, {
          xAxis: timeAxis(), yAxis: { type: "value", name: "°C", scale: true },
          series: [{ type: "line", name: "Temperature", data: sensor(96, 15 * MIN, { seed: 2 }) }]
        });
      }
    },
    {
      title: "Multiple Series",
      level: 1,
      desc: "Several sensors on one chart. Click a legend item to hide or show that series.",
      render(b) {
        AX.chart(b, {
          legend: { top: 0 }, xAxis: timeAxis(), yAxis: { type: "value", scale: true },
          series: ["Zone A", "Zone B", "Zone C"].map((name, i) => ({ type: "line", name, data: sensor(48, HOUR, { base: 20 + i * 2, amp: 3 + i, seed: i + 5 }) }))
        });
      }
    },
    {
      title: "Threshold Lines",
      level: 1,

        const data = D.ts(240, HOUR, vals);
        const ctl = AX.add(b, `<div class="ax-ctl"><label>Sensitivity (k) <input type="range" min="1.5" max="4" step="0.1" value="2.5" aria-label="Sensitivity"></label><strong data-k></strong><span class="ax-pill ax-pill--bad" data-n></span></div>`);
        const c = AX.chart(b, { legend: { top: 0, data: ["Reading", "Expected range", "Anomaly"] }, xAxis: timeAxis(), yAxis: { type: "value", scale: true }, series: [
          { type: "line", name: "Reading", data },
          { type: "line", name: "lower", lineStyle: { opacity: 0 }, stack: "b", symbol: "none", tooltip: { show: false } },
          { type: "line", name: "Expected range", lineStyle: { opacity: 0 }, stack: "b", areaStyle: { color: "rgba(79,70,229,.08)" }, itemStyle: { color: "#c7d2fe" }, symbol: "none", tooltip: { show: false } },
          { type: "scatter", name: "Anomaly", symbolSize: 11, itemStyle: { color: "#ef4444" } }
        ] }, 240);
        const draw = k => {
          const W = 24, lo = [], width = [], hits = [];
          data.forEach(([t, v], i) => {
            const win = data.slice(Math.max(0, i - W), i).map(p => p[1]);
            if (win.length < 6) { lo.push([t, null]); width.push([t, null]); return; }

          ctl.querySelector("[data-k]").textContent = k;
          ctl.querySelector("[data-n]").textContent = `${hits.length} anomalies`;
          c.setOption({ series: [{}, { data: lo }, { data: width }, { data: hits }] });
